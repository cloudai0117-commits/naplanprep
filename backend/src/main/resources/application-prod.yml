server:
  # Azure Front Door sends X-Forwarded-For; NATIVE lets Tomcat's RemoteIpValve
  # set request.getRemoteAddr() to the real client IP for rate limiting.
  forward-headers-strategy: NATIVE

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:naplanprep_prod}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL:true}
  flyway:
    out-of-order: false
    validate-on-migrate: true

logging:
  level:
    root: WARN
    au.com.naplanprep: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    access-token-expiry: 900
    refresh-token-expiry: 604800
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  cors:
    allowed-origins:
      - https://naplanprep.com.au
      - https://www.naplanprep.com.au
      - https://app.naplanprep.com.au
      - https://admin.naplanprep.com.au
  frontend-url: https://app.naplanprep.com.au
  stripe:
    advanced-price-id: ${STRIPE_ADVANCED_PRICE_ID}
    pro-price-id: ${STRIPE_PRO_PRICE_ID}
  rate-limit:
    auth-attempts: 5
    auth-lockout-minutes: 15
