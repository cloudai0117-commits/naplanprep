spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/naplanprep_test}
    username: ${SPRING_DATASOURCE_USERNAME:testuser}
    password: ${SPRING_DATASOURCE_PASSWORD:testpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false
  jpa:
    show-sql: false
  flyway:
    # V100-V374 content migrations own their own BEGIN/COMMIT.
    # Disable Flyway's per-migration transaction wrapper to avoid
    # PostgreSQL "there is already a transaction in progress" warnings.
    execute-in-transaction: false

app:
  jwt:
    private-key-path: classpath:jwt/test-private.pem
    public-key-path: classpath:jwt/test-public.pem
    access-token-expiry: 900
    refresh-token-expiry: 604800
  scheduler:
    enabled: false
  stripe:
    # Test profile: placeholder values that cannot authenticate with Stripe.
    # The webhook secret is a deterministic test value used by SubscriptionFlowApiTest
    # to generate valid HMAC-SHA256 signatures without any real Stripe credentials.
    secret-key: ${STRIPE_SECRET_KEY:sk_test_naplanprep_ci_placeholder}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_naplanprep_ci_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_naplanprep_ci_test_signing_key_2024}
    # Empty defaults: resolvePriceId() returns blank → BusinessException("price ID not configured")
    # This lets checkout_returns_stripe_not_configured_error get 400 without a real Stripe key.
    # In UAT, the real STRIPE_ADVANCED_PRICE_ID / STRIPE_PRO_PRICE_ID env vars are set.
    advanced-price-id: ${STRIPE_ADVANCED_PRICE_ID:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
  cors:
    allowed-origins:
      - http://localhost:3000
  frontend-url: http://localhost:3000
  rate-limit:
    auth-attempts: 5
    auth-lockout-minutes: 15

logging:
  level:
    root: WARN
    au.com.naplanprep: INFO
