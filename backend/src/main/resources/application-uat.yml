spring:
  flyway:
    validate-on-migrate: false
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    # Railway injects DATABASE_URL (postgresql://user:pass@host:port/db) — use it directly if available,
    # otherwise fall back to individual DB_HOST/DB_PORT vars set manually in Railway dashboard
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:naplanprep_uat}}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  data:
    redis:
      # Railway injects REDIS_HOST/REDIS_PORT from linked Redis service
      host: ${REDIS_HOST:${REDISHOST:localhost}}
      port: ${REDIS_PORT:${REDISPORT:6379}}
      password: ${REDIS_PASSWORD:${REDISPASSWORD:}}
      timeout: 2000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          enabled: false

logging:
  level:
    root: INFO
    au.com.naplanprep: INFO

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiry: 900
    refresh-token-expiry: 604800
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    # Hardcoded placeholder so Railway STRIPE_WEBHOOK_SECRET cannot override bypass in UAT
    webhook-secret: whsec_placeholder
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  cors:
    allowed-origins:
      - https://naplanprep.com.au
      - https://www.naplanprep.com.au
      - https://admin.naplanprep.com.au
      - https://uat.naplanprep.com.au
      - https://admin.uat.naplanprep.com.au
      - https://*.vercel.app
      - http://localhost:5173
      - http://localhost:5174
  frontend-url: https://frontend-nu-topaz-20.vercel.app
  rate-limit:
    auth-attempts: 5
    auth-lockout-minutes: 15
