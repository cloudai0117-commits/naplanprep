server:
  forward-headers-strategy: NATIVE

spring:
  flyway:
    out-of-order: false
    # If V381 recorded a FAILED state in flyway_schema_history (e.g., from a partial
    # run on a previous deployment), ignore it so V382 can proceed and repair the data.
    ignore-migration-patterns: "*:Failed"
  jpa:
    hibernate:
      ddl-auto: none
  datasource:
    # Railway injects DATABASE_URL (postgresql://user:pass@host:port/db) — use it directly if available,
    # otherwise fall back to individual DB_HOST/DB_PORT vars set manually in Railway dashboard
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:naplanprep_uat}}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  data:
    redis:
      # Railway injects REDIS_HOST/REDIS_PORT from linked Redis service
      host: ${REDIS_HOST:${REDISHOST:localhost}}
      port: ${REDIS_PORT:${REDISPORT:6379}}
      password: ${REDIS_PASSWORD:${REDISPASSWORD:}}
      timeout: 2000ms
      connect-timeout: 3000ms
      lettuce:
        pool:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    au.com.naplanprep: INFO

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-token-expiry: 900
    refresh-token-expiry: 604800
  stripe:
    # All Stripe values are REQUIRED in UAT — no defaults.
    # The application will fail to start if any of these are missing.
    # Set these in the Railway dashboard (Variables tab) or Azure Application Settings.
    # NEVER put real values in this file.
    secret-key: ${STRIPE_SECRET_KEY}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    advanced-price-id: ${STRIPE_ADVANCED_PRICE_ID}
    pro-price-id: ${STRIPE_PRO_PRICE_ID}
  cors:
    allowed-origins:
      - https://naplanprep.com.au
      - https://www.naplanprep.com.au
      - https://admin.naplanprep.com.au
      - https://uat.naplanprep.com.au
      - https://admin.uat.naplanprep.com.au
      - https://*.vercel.app
      - http://localhost:5173
      - http://localhost:5174
  frontend-url: https://frontend-nu-topaz-20.vercel.app
  rate-limit:
    auth-attempts: 5
    auth-lockout-minutes: 15
