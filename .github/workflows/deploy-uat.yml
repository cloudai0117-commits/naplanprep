name: Deploy — UAT

on:
  push:
    branches: [develop]

jobs:
  deploy-backend-uat:
    name: Deploy Backend to Railway UAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Railway env vars (Stripe keys)
        run: |
          railway variables --set "STRIPE_SECRET_KEY=${{ secrets.STRIPE_TEST_SECRET_KEY }}" \
            --service naplanprep-backend-uat --environment uat
          railway variables --set "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}" \
            --service naplanprep-backend-uat --environment uat
          railway variables --set "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}" \
            --service naplanprep-backend-uat --environment uat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: fc40e9ef-0983-4774-b3ec-7ec138bb370a

      - name: Deploy backend to Railway UAT
        run: |
          cd backend
          railway up --service naplanprep-backend-uat --environment uat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: fc40e9ef-0983-4774-b3ec-7ec138bb370a

      - name: Wait for Railway to be ready
        run: sleep 30

  deploy-frontend-uat:
    name: Deploy Frontend to Vercel UAT
    runs-on: ubuntu-latest
    needs: deploy-backend-uat

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend to Vercel UAT
        run: |
          cd frontend
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL=${{ secrets.UAT_API_URL }} \
            --build-env VITE_STRIPE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-admin-uat:
    name: Deploy Admin to Vercel UAT
    runs-on: ubuntu-latest
    needs: deploy-backend-uat

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy admin to Vercel UAT
        run: |
          cd admin-panel
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL=${{ secrets.UAT_API_URL }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  smoke-test-uat:
    name: UAT Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend-uat, deploy-admin-uat]
    if: ${{ vars.UAT_API_URL != '' }}

    steps:
      - name: Health check
        run: |
          sleep 20
          curl -f ${{ vars.UAT_API_URL }}/actuator/health || exit 1
          echo "UAT smoke test passed"
