name: Deploy — UAT

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-frontend
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-admin
  RAILWAY_API: https://backboard.railway.app/graphql/v2
  RAILWAY_PROJECT_ID: fc40e9ef-0983-4774-b3ec-7ec138bb370a
  RAILWAY_ENV_ID: 588e636a-0be4-4fee-8a7e-02ce26f5ec6f
  RAILWAY_BACKEND_SERVICE_ID: 58b84f41-861e-41e1-9440-e73d5a54e18b

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      backend-digest: ${{ steps.build-backend.outputs.digest }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "tag=uat-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build & push backend
        id: build-backend
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.UAT_API_URL || 'https://naplanprep-backend-uat-uat.up.railway.app/v1' }}
            VITE_STRIPE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./admin-panel
          push: true
          build-args: |
            VITE_API_URL=${{ vars.UAT_API_URL || 'https://naplanprep-backend-uat-uat.up.railway.app/v1' }}
          tags: |
            ${{ env.ADMIN_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.ADMIN_IMAGE }}:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify GHCR push artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DIGEST="${{ steps.build-backend.outputs.digest }}"
          IMAGE="${{ env.BACKEND_IMAGE }}:$TAG"
          echo "===== GHCR PUSH VERIFICATION ====="
          echo "COMMIT_SHA=${{ github.sha }}"
          echo "BACKEND_IMAGE_TAG=$TAG"
          echo "BACKEND_IMAGE_DIGEST=${DIGEST:-MISSING}"
          echo "FULL_IMAGE_REF=$IMAGE"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: backend image digest is empty — GHCR push did not succeed"
            exit 1
          fi
          echo "GHCR_PUSH = PASS"

  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deployment diagnostic header
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          DIGEST="${{ needs.build-and-push.outputs.backend-digest }}"
          IMAGE="${{ env.BACKEND_IMAGE }}:$TAG"
          echo "===== DEPLOYMENT PLAN ====="
          echo "COMMIT_SHA=${{ github.sha }}"
          echo "BACKEND_IMAGE_TAG=$TAG"
          echo "BACKEND_IMAGE_DIGEST=${DIGEST:-MISSING}"
          echo "EXPECTED_IMAGE=$IMAGE"
          echo "RAILWAY_SERVICE_ID=${{ env.RAILWAY_BACKEND_SERVICE_ID }}"
          echo "RAILWAY_ENV_ID=${{ env.RAILWAY_ENV_ID }}"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: No image digest from build-and-push — aborting before touching Railway"
            exit 1
          fi

      - name: Set env vars on Railway
        run: |
          # Only upsert if value is non-empty — preserves existing Railway values
          # when a GitHub secret is not yet configured for this repo.
          railway_var() {
            if [ -z "$2" ]; then
              echo "Skipping $1 — secret not configured (existing Railway value preserved)"
              return 0
            fi
            curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d "{\"query\":\"mutation{variableUpsert(input:{projectId:\\\"${{ env.RAILWAY_PROJECT_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",name:\\\"$1\\\",value:\\\"$2\\\"})}\"}"\
              > /dev/null && echo "Set $1" || echo "Warning: failed to set $1 (env var may already be set in Railway)"
          }
          railway_var "STRIPE_SECRET_KEY"         "${{ secrets.STRIPE_TEST_SECRET_KEY }}"
          railway_var "STRIPE_WEBHOOK_SECRET"     "${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}"
          railway_var "STRIPE_PUBLISHABLE_KEY"    "${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}"
          railway_var "STRIPE_ADVANCED_PRICE_ID"  "${{ secrets.STRIPE_TEST_ADVANCED_PRICE_ID }}"
          railway_var "STRIPE_PRO_PRICE_ID"       "${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}"
          railway_var "SPRING_PROFILES_ACTIVE"    "uat"
          railway_var "CI_SERVICE_EMAIL"          "${{ secrets.CI_SERVICE_EMAIL }}"
          railway_var "CI_SERVICE_PASSWORD"       "${{ secrets.CI_SERVICE_PASSWORD }}"
          echo "Env var step complete (failures are non-fatal — vars persist in Railway)"

      - name: Update Railway service source — image and GHCR credentials
        # Sets the exact immutable GHCR image (uat-<sha>) on Railway in ONE atomic call
        # that also carries GHCR pull credentials so Railway can pull the private image.
        #
        # WHY ONE CALL: If credentials were set in a separate prior step and then the image
        # were set again in a second step, the second serviceInstanceUpdate would overwrite
        # (replace) the source object, wiping the credentials. One call prevents that.
        #
        # WHY inputFields: Railway's ServiceInstanceSourceInput is an INPUT_OBJECT type.
        # GraphQL introspection uses `inputFields` for INPUT_OBJECT (not `fields`, which is
        # for OBJECT types). The previous step used `fields` and always got empty — that was
        # the reason credentials were never configured despite GHCR_READ_TOKEN being set.
        #
        # PAT (GHCR_READ_TOKEN) is masked via ::add-mask:: and passed exclusively as an env
        # var to Python. It is never echoed, never in shell history, never in Railway env vars.
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          IMAGE="${{ env.BACKEND_IMAGE }}:$TAG"
          echo "===== UPDATE RAILWAY SERVICE SOURCE (IMAGE + GHCR CREDENTIALS) ====="
          echo "EXPECTED_IMAGE=$IMAGE"
          echo ""

          # ── Step A: Comprehensive Railway schema dump to find credential input type ──
          # ServiceInstanceSourceInput returns null → type name is wrong or doesn't exist.
          # Dump ALL INPUT_OBJECT types: find any with credential/auth/username/password fields,
          # or names containing source/docker/registry/credential/image.
          # Also probe specific guesses by name.
          CRED_FIELD=""
          SOURCE_TYPE_NAME=""
          if [ -n "$GHCR_READ_TOKEN" ]; then
            echo "::add-mask::$GHCR_READ_TOKEN"
            echo "GHCR_READ_TOKEN: present — scanning Railway schema for credential input type"

            # Comprehensive: get ALL INPUT_OBJECT types in the schema
            SCHEMA_TYPES=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d '{"query":"{ __schema { types { name kind inputFields { name } } } }"}')

            echo "--- Railway INPUT_OBJECT types (credential/source/docker/registry/image filter) ---"
            echo "$SCHEMA_TYPES" | python3 -c "
import sys, json
d = json.load(sys.stdin)
types = d.get('data', {}).get('__schema', {}).get('types', [])
# Find input types relevant to source/credential configuration
KEY_NAMES = {'credential','auth','username','password','registry','token'}
KEY_IN_TYPE = {'source','docker','registry','credential','image','service'}
interesting = []
for t in types:
    if t.get('kind') != 'INPUT_OBJECT':
        continue
    tname = (t.get('name') or '').lower()
    fields = [f['name'] for f in (t.get('inputFields') or [])]
    field_names_lower = {f.lower() for f in fields}
    type_interesting = any(k in tname for k in KEY_IN_TYPE)
    field_interesting = any(k in fn for fn in field_names_lower for k in KEY_NAMES)
    if type_interesting or field_interesting:
        interesting.append((t.get('name',''), fields))
interesting.sort()
if interesting:
    for name, fields in interesting:
        print(f'  TYPE: {name}')
        print(f'    inputFields: {fields}')
else:
    print('  (no credential-related input types found)')
" 2>/dev/null || echo "(schema dump failed — $SCHEMA_TYPES)"

            # Also probe specific candidate type names by direct introspection
            echo ""
            echo "--- Direct type probes ---"
            for TYPE_GUESS in ServiceInstanceSourceInput ServiceSourceInput ServiceInstanceInput ServiceCreateInput DockerRegistryCredentials RegistryCredentials ServiceSource DockerImageSource; do
              PROBE=$(curl -s --max-time 10 -X POST "${{ env.RAILWAY_API }}" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
                -d "{\"query\":\"{ t: __type(name:\\\"${TYPE_GUESS}\\\") { kind inputFields { name } } }\"}")
              PROBE_KIND=$(echo "$PROBE" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('data',{}).get('t'); print(t.get('kind','?') if t else 'NOT_FOUND')" 2>/dev/null || echo "ERR")
              PROBE_FIELDS=$(echo "$PROBE" | python3 -c "import sys,json; d=json.load(sys.stdin); t=d.get('data',{}).get('t') or {}; print(' '.join(f['name'] for f in (t.get('inputFields') or [])))" 2>/dev/null || echo "")
              echo "  ${TYPE_GUESS}: kind=${PROBE_KIND} inputFields=[${PROBE_FIELDS}]"
            done

            # Extract the credential field from schema dump results
            CRED_FIELD=$(echo "$SCHEMA_TYPES" | python3 -c "
import sys, json
d = json.load(sys.stdin)
types = d.get('data', {}).get('__schema', {}).get('types', [])
KEY_NAMES = {'credential','auth','username','password','registry','token'}
KEY_IN_TYPE = {'source','docker','registry','credential','image'}
CRED_CANDIDATES = ['imageCredentials','registryCredentials','dockerCredentials','credentials','auth']
for t in types:
    if t.get('kind') != 'INPUT_OBJECT': continue
    tname = (t.get('name') or '').lower()
    fields = [f['name'] for f in (t.get('inputFields') or [])]
    type_interesting = any(k in tname for k in KEY_IN_TYPE)
    if type_interesting:
        for cand in CRED_CANDIDATES:
            if cand in fields:
                print(cand)
                sys.exit(0)
print('')
" 2>/dev/null || echo "")

            if [ -n "$CRED_FIELD" ]; then
              echo ""
              echo "CREDENTIAL_FIELD_FOUND = $CRED_FIELD"
              # Also find which type contains this field
              SOURCE_TYPE_NAME=$(echo "$SCHEMA_TYPES" | python3 -c "
import sys, json
d = json.load(sys.stdin)
types = d.get('data', {}).get('__schema', {}).get('types', [])
cred_cands = ['imageCredentials','registryCredentials','dockerCredentials','credentials','auth']
for t in types:
    if t.get('kind') != 'INPUT_OBJECT': continue
    fields = [f['name'] for f in (t.get('inputFields') or [])]
    if any(c in fields for c in cred_cands) and 'source' in (t.get('name') or '').lower():
        print(t.get('name',''))
        sys.exit(0)
print('')
" 2>/dev/null || echo "")
              echo "SOURCE_TYPE_NAME = ${SOURCE_TYPE_NAME:-unknown}"
            else
              echo ""
              echo "PRIVATE_REGISTRY_EXISTING_SERVICE_SUPPORT = NO"
              echo "  No credential inputField found in any source-related INPUT_OBJECT type."
              echo "  Proceeding with image-only update — Railway does not support private"
              echo "  registry credentials for existing services via GraphQL API."
            fi
          else
            echo "GHCR_READ_TOKEN not configured — image-only update (no credentials)"
          fi

          # ── Step B: Build serviceInstanceUpdate payload (image + optional creds) ──
          export RAILWAY_IMAGE="$IMAGE"
          export RAILWAY_CRED_FIELD="${CRED_FIELD:-}"
          python3 << 'PYEOF'
          import json, os, sys

          svc_id = "${{ env.RAILWAY_BACKEND_SERVICE_ID }}"
          env_id = "${{ env.RAILWAY_ENV_ID }}"
          image  = os.environ.get('RAILWAY_IMAGE', '')
          field  = os.environ.get('RAILWAY_CRED_FIELD', '')
          pat    = os.environ.get('GHCR_READ_TOKEN', '')

          if field and pat:
              source_gql = (
                  'image:"' + image + '",'
                  + field + ':{username:"cloudai0117-commits",password:"' + pat + '"}'
              )
              print(f"Payload: image={image}, credential={field} (PAT is masked in CI logs)")
          else:
              source_gql = 'image:"' + image + '"'
              print(f"Payload: image={image}, no credentials")

          gql = (
              'mutation{serviceInstanceUpdate('
              + 'serviceId:"' + svc_id + '",'
              + 'environmentId:"' + env_id + '",'
              + 'input:{source:{' + source_gql + '},startCommand:null}'
              + ')}'
          )
          with open('/tmp/svc_update_payload.json', 'w') as f:
              f.write(json.dumps({'query': gql}))
          PYEOF

          if [ $? -ne 0 ]; then
            echo "FAIL: Could not build serviceInstanceUpdate payload"
            exit 1
          fi

          # ── Step C: Execute the update ────────────────────────────────────────────
          UPDATE_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d @/tmp/svc_update_payload.json)
          rm -f /tmp/svc_update_payload.json

          echo "serviceInstanceUpdate response:"
          echo "$UPDATE_RESP" | python3 -m json.tool 2>/dev/null || echo "$UPDATE_RESP"

          GQL_ERRORS=$(echo "$UPDATE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); errs=d.get('errors',[]); print('ERRORS: '+json.dumps(errs) if errs else 'OK')" 2>/dev/null || echo "PARSE_ERROR")
          if [ "$GQL_ERRORS" != "OK" ]; then
            echo "FAIL: serviceInstanceUpdate returned GraphQL errors: $GQL_ERRORS"
            echo "Check that RAILWAY_TOKEN has write access to this service."
            exit 1
          fi

          # ── Step D: Verify the source image actually persisted ────────────────────
          echo ""
          echo "Verifying service source was updated..."
          INSTANCE_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"{serviceInstance(serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\"){source{image repo}}}\"}")

          echo "serviceInstance (source) response:"
          echo "$INSTANCE_RESP" | python3 -m json.tool 2>/dev/null || echo "$INSTANCE_RESP"

          CONFIGURED_IMAGE=$(echo "$INSTANCE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('serviceInstance',{}).get('source',{}).get('image','NOT_SET'))" 2>/dev/null || echo "PARSE_ERROR")
          echo ""
          echo "CONFIGURED_IMAGE_AFTER_UPDATE=$CONFIGURED_IMAGE"
          echo "EXPECTED_IMAGE=$IMAGE"

          if [ "$CONFIGURED_IMAGE" != "$IMAGE" ]; then
            echo "FAIL: Railway service source shows '$CONFIGURED_IMAGE' after update, expected '$IMAGE'."
            echo "      serviceInstanceUpdate returned no GQL errors but source did not persist."
            echo "      Aborting — triggering a deploy now would run OLD code."
            echo "      Check RAILWAY_TOKEN permissions and Railway service configuration."
            exit 1
          fi

          echo "SERVICE_IMAGE_SOURCE_VERIFIED = PASS"
          if [ -n "$CRED_FIELD" ]; then
            echo "RAILWAY_GHCR_CREDENTIAL = CONFIGURED (field=$CRED_FIELD)"
          else
            echo "RAILWAY_GHCR_CREDENTIAL = NOT_SET (no inputField found or token missing)"
          fi
          echo "SERVICE_IMAGE_UPDATE = PASS"

      - name: Deploy new Railway service image
        id: trigger-deploy
        # Confirmed no-ops (return true, create nothing):
        #   environmentTriggersDeploy — silent no-op for this service
        #   deploymentRestart         — returns true, no new deployment appears
        # Confirmed does not exist in Railway schema:
        #   deploymentCreate
        #
        # Strategy (in order):
        #   1. Introspect Railway schema — print all mutation names to CI log for diagnostics
        #   2. Try serviceInstanceRedeploy(serviceId, environmentId) — "Deploy a service"
        #      distinct from deploymentRestart ("Restart a deployment")
        #   3. If that mutation does not exist: install Railway CLI and railway redeploy
        #      (the CLI encapsulates the correct current Railway deploy API)
        #
        # New deployment is identified by:
        #   (a) deployment ID returned directly by the mutation, OR
        #   (b) polling for any deployment with createdAt > PRE_TRIGGER_TIME AND id != PREV_ID
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          IMAGE="${{ env.BACKEND_IMAGE }}:$TAG"
          DIGEST="${{ needs.build-and-push.outputs.backend-digest }}"
          # Include milliseconds so "14:48:07.000Z" > "14:48:07.460Z" compares correctly.
          # Without .000 suffix Railway's .460Z response sorts BEFORE the trigger time
          # in ASCII comparison ("." = 46 < "Z" = 90) causing false "no new deployment".
          PRE_TRIGGER_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "===== DEPLOY NEW RAILWAY IMAGE ====="
          echo "COMMIT_SHA=${{ github.sha }}"
          echo "EXPECTED_IMAGE=$IMAGE"
          echo "EXPECTED_DIGEST=${DIGEST:-MISSING}"
          echo "PRE_TRIGGER_TIME=$PRE_TRIGGER_TIME"

          # ── Step 1: Capture previous deployment ID so we can detect the NEW one ──
          curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"{deployments(input:{serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\"}){edges{node{id status createdAt}}}}\"}" \
            > /tmp/pre_deploys.json

          PREVIOUS_DEPLOY_ID=$(python3 -c "import json; d=json.load(open('/tmp/pre_deploys.json')); nodes=[e['node'] for e in d.get('data',{}).get('deployments',{}).get('edges',[])]; nodes.sort(key=lambda n:n.get('createdAt',''),reverse=True); succ=[n for n in nodes if n.get('status') in ('SUCCESS','ACTIVE')]; print(succ[0]['id'] if succ else (nodes[0]['id'] if nodes else ''))" 2>/dev/null || echo "")
          echo "PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_DEPLOY_ID"

          # ── Step 2: Introspect Railway schema — print all mutation names ──────────
          echo ""
          echo "===== RAILWAY SCHEMA INTROSPECTION (all mutations) ====="
          SCHEMA_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d '{"query":"{__schema{mutationType{fields{name}}}}"}')
          python3 -c "import sys,json; d=json.load(sys.stdin); fields=d.get('data',{}).get('__schema',{}).get('mutationType',{}).get('fields',[]); names=[f['name'] for f in fields]; names.sort(); [print(' ',n) for n in names]" <<< "$SCHEMA_RESP" 2>/dev/null || echo "(schema introspection failed — $SCHEMA_RESP)"
          echo "===== END SCHEMA INTROSPECTION ====="
          echo ""

          # Extract service-related mutation names for logging
          SERVICE_MUTATIONS=$(python3 -c "import sys,json; d=json.load(sys.stdin); fields=d.get('data',{}).get('__schema',{}).get('mutationType',{}).get('fields',[]); names=[f['name'] for f in fields if 'service' in f['name'].lower() or 'deploy' in f['name'].lower()]; print(','.join(sorted(names)))" <<< "$SCHEMA_RESP" 2>/dev/null || echo "")
          echo "SERVICE/DEPLOY MUTATIONS AVAILABLE: $SERVICE_MUTATIONS"

          # ── Step 3: Try serviceInstanceRedeploy ──────────────────────────────────
          echo ""
          echo "Attempting serviceInstanceRedeploy(serviceId, environmentId)..."
          REDEPLOY_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"mutation{serviceInstanceRedeploy(serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\")}\"}")

          echo "serviceInstanceRedeploy response:"
          echo "$REDEPLOY_RESP" | python3 -m json.tool 2>/dev/null || echo "$REDEPLOY_RESP"

          REDEPLOY_GQL_ERRORS=$(echo "$REDEPLOY_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); errs=d.get('errors',[]); print('ERRORS: '+json.dumps(errs) if errs else 'OK')" 2>/dev/null || echo "PARSE_ERROR")

          if [ "$REDEPLOY_GQL_ERRORS" = "OK" ]; then
            echo "serviceInstanceRedeploy = ACCEPTED (no GQL errors)"
          else
            echo "serviceInstanceRedeploy failed: $REDEPLOY_GQL_ERRORS"
            echo ""
            echo "Falling back to Railway CLI redeploy..."

            # ── Step 4: Railway CLI fallback ────────────────────────────────────────
            # The CLI encapsulates the correct current Railway deploy API internally.
            echo "Installing Railway CLI..."
            npm install -g @railway/cli 2>&1 | tail -3
            railway --version

            echo "Running: railway redeploy --service ${{ env.RAILWAY_BACKEND_SERVICE_ID }} --yes"
            RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN }}" \
            railway redeploy \
              --service "${{ env.RAILWAY_BACKEND_SERVICE_ID }}" \
              --yes || true
            echo "Railway CLI redeploy exit: $?"
          fi

          # ── Step 5: Poll for the new deployment ─────────────────────────────────
          # Detection criteria (BOTH must be true):
          #   datetime(createdAt) >= datetime(PRE_TRIGGER_TIME)  — proper ISO-8601 parse
          #   id != PREVIOUS_DEPLOY_ID
          #
          # Use datetime.fromisoformat() not string compare — Railway returns milliseconds
          # (e.g. 14:48:07.460Z) while PRE_TRIGGER_TIME uses .000Z; ASCII comparison
          # would put .460Z BEFORE Z due to "." (46) < "Z" (90), causing false negatives.
          #
          # Poll 20 × 15s = 5 min to handle Railway's eventual consistency.
          # After loop, run one final fresh query before declaring failure.
          _dt() { python3 -c "import datetime; print(datetime.datetime.fromisoformat('$1'.replace('Z','+00:00')).isoformat())" 2>/dev/null || echo "$1"; }
          DEPLOY_ID=""
          for ATTEMPT in $(seq 1 20); do
            echo "Waiting 15s for Railway to register the new deployment (attempt $ATTEMPT/20)..."
            sleep 15

            curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d "{\"query\":\"{deployments(input:{serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\"}){edges{node{id status createdAt}}}}\"}" \
              > /tmp/deploys.json

            DEPLOYS_GQL_ERRORS=$(python3 -c "import sys,json; d=json.load(open('/tmp/deploys.json')); errs=d.get('errors',[]); print('ERRORS: '+json.dumps(errs) if errs else 'OK')" 2>/dev/null || echo "PARSE_ERROR")
            if [ "$DEPLOYS_GQL_ERRORS" != "OK" ]; then
              echo "RAILWAY_GRAPHQL_ERROR: $DEPLOYS_GQL_ERRORS"
              exit 1
            fi

            DEPLOY_ID=$(python3 -c "import json,datetime; pre=datetime.datetime.fromisoformat('$PRE_TRIGGER_TIME'.replace('Z','+00:00')); d=json.load(open('/tmp/deploys.json')); nodes=[e['node'] for e in d.get('data',{}).get('deployments',{}).get('edges',[])]; nodes.sort(key=lambda n:n.get('createdAt',''),reverse=True); new=[n for n in nodes if n.get('createdAt') and datetime.datetime.fromisoformat(n['createdAt'].replace('Z','+00:00'))>=pre and n.get('id','')!='$PREVIOUS_DEPLOY_ID']; print(new[0]['id'] if new else '')" 2>/dev/null || echo "")

            if [ -n "$DEPLOY_ID" ]; then
              echo "New Railway deployment found after attempt $ATTEMPT: $DEPLOY_ID"
              break
            fi
            echo "  No new deployment yet (pre_trigger=$PRE_TRIGGER_TIME, prev=$PREVIOUS_DEPLOY_ID)"
          done

          # ── Final fallback query — one more fresh fetch before declaring failure ──
          # Railway's deployment list can be eventually consistent; the previous run
          # proved deployment d4ca1a26 existed but was invisible during the poll window.
          if [ -z "$DEPLOY_ID" ]; then
            echo ""
            echo "Poll loop ended with no result — performing final fresh query..."
            curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d "{\"query\":\"{deployments(input:{serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\"}){edges{node{id status createdAt}}}}\"}" \
              > /tmp/deploys_final.json
            cp /tmp/deploys_final.json /tmp/deploys.json

            echo "Final query — all deployments:"
            cat /tmp/deploys_final.json | python3 -m json.tool 2>/dev/null || cat /tmp/deploys_final.json

            DEPLOY_ID=$(python3 -c "import json,datetime; pre=datetime.datetime.fromisoformat('$PRE_TRIGGER_TIME'.replace('Z','+00:00')); d=json.load(open('/tmp/deploys.json')); nodes=[e['node'] for e in d.get('data',{}).get('deployments',{}).get('edges',[])]; nodes.sort(key=lambda n:n.get('createdAt',''),reverse=True); new=[n for n in nodes if n.get('createdAt') and datetime.datetime.fromisoformat(n['createdAt'].replace('Z','+00:00'))>=pre and n.get('id','')!='$PREVIOUS_DEPLOY_ID']; print(new[0]['id'] if new else '')" 2>/dev/null || echo "")
            if [ -n "$DEPLOY_ID" ]; then
              echo "New Railway deployment found in final query: $DEPLOY_ID"
            fi
          fi

          if [ -z "$DEPLOY_ID" ]; then
            echo ""
            echo "FAIL: No new deployment appeared after deploy trigger."
            echo "      PRE_TRIGGER_TIME=$PRE_TRIGGER_TIME"
            echo "      PREVIOUS_DEPLOYMENT_ID=$PREVIOUS_DEPLOY_ID"
            echo "      EXPECTED_IMAGE=$IMAGE"
            echo "Attempted: serviceInstanceRedeploy, Railway CLI redeploy."
            echo "See schema introspection above for all available Railway mutations."
            exit 1
          fi

          DEPLOY_STATUS=$(python3 -c "import json,datetime; pre=datetime.datetime.fromisoformat('$PRE_TRIGGER_TIME'.replace('Z','+00:00')); d=json.load(open('/tmp/deploys.json')); nodes=[e['node'] for e in d.get('data',{}).get('deployments',{}).get('edges',[])]; nodes.sort(key=lambda n:n.get('createdAt',''),reverse=True); new=[n for n in nodes if n.get('createdAt') and datetime.datetime.fromisoformat(n['createdAt'].replace('Z','+00:00'))>=pre and n.get('id','')!='$PREVIOUS_DEPLOY_ID']; print(new[0].get('status','UNKNOWN') if new else 'NOT_FOUND')" 2>/dev/null || echo "UNKNOWN")
          DEPLOY_CREATED=$(python3 -c "import json,datetime; pre=datetime.datetime.fromisoformat('$PRE_TRIGGER_TIME'.replace('Z','+00:00')); d=json.load(open('/tmp/deploys.json')); nodes=[e['node'] for e in d.get('data',{}).get('deployments',{}).get('edges',[])]; nodes.sort(key=lambda n:n.get('createdAt',''),reverse=True); new=[n for n in nodes if n.get('createdAt') and datetime.datetime.fromisoformat(n['createdAt'].replace('Z','+00:00'))>=pre and n.get('id','')!='$PREVIOUS_DEPLOY_ID']; print(new[0].get('createdAt','') if new else '')" 2>/dev/null || echo "")

          # ── Query service instance source to verify correct image is configured ──
          echo ""
          echo "Querying Railway service source (image identity verification)..."
          SOURCE_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"{serviceInstance(serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\"){source{image repo}}}\"}")
          DEPLOYED_SOURCE=$(echo "$SOURCE_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('serviceInstance',{}).get('source',{}).get('image','NOT_SET'))" 2>/dev/null || echo "QUERY_FAILED")
          echo "IMAGE_SOURCE=$DEPLOYED_SOURCE"
          if [ "$DEPLOYED_SOURCE" = "$IMAGE" ]; then
            IMAGE_MATCH="PASS"
          elif [ "$DEPLOYED_SOURCE" = "NOT_SET" ] || [ "$DEPLOYED_SOURCE" = "QUERY_FAILED" ]; then
            IMAGE_MATCH="NOT_VERIFIABLE_BY_CURRENT_API"
          else
            IMAGE_MATCH="MISMATCH — service source is $DEPLOYED_SOURCE, expected $IMAGE"
          fi
          echo "IMAGE_MATCH=$IMAGE_MATCH"

          echo ""
          echo "RAILWAY_DEPLOYMENT_ID=$DEPLOY_ID"
          echo "RAILWAY_DEPLOYMENT_PREVIOUS_ID=$PREVIOUS_DEPLOY_ID"
          echo "RAILWAY_DEPLOYMENT_STATUS=$DEPLOY_STATUS"
          echo "RAILWAY_DEPLOYMENT_CREATED=$DEPLOY_CREATED"
          echo "NEW_DEPLOYMENT_ID_DIFFERS_FROM_PREVIOUS=$([ "$DEPLOY_ID" != "$PREVIOUS_DEPLOY_ID" ] && echo YES || echo NO)"
          echo "TIMESTAMP_COMPARISON=PASS (createdAt=$DEPLOY_CREATED >= pre_trigger=$PRE_TRIGGER_TIME)"
          echo "EXPECTED_IMAGE=$IMAGE"
          echo "DEPLOYED_SOURCE=$DEPLOYED_SOURCE"
          echo "IMAGE_MATCH=$IMAGE_MATCH"
          echo "DEPLOYMENT_ID_CAPTURE = PASS"
          echo "deployment-id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Poll Railway deployment status until ACTIVE/SUCCESS
        # Do not health-poll until Railway itself says the deployment is done.
        # Terminal success:  SUCCESS, ACTIVE
        # Terminal failure:  FAILED, CRASHED, REMOVED, ERROR
        # In-progress:       QUEUED, INITIALIZING, BUILDING, DEPLOYING, SLEEPING
        run: |
          DEPLOY_ID="${{ steps.trigger-deploy.outputs.deployment-id }}"
          echo "Polling Railway deployment $DEPLOY_ID for SUCCESS/ACTIVE (max 15 min, 20s interval)..."
          echo "Terminal success statuses: SUCCESS, ACTIVE"
          echo "Terminal failure statuses: FAILED, CRASHED, REMOVED, ERROR"

          for i in $(seq 1 45); do
            STATUS_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d "{\"query\":\"{deployment(id:\\\"$DEPLOY_ID\\\"){id status createdAt}}\"}")

            DEP_STATUS=$(echo "$STATUS_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('deployment',{}).get('status','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")

            echo "Attempt $i/45 — Railway deployment $DEPLOY_ID status: $DEP_STATUS"

            case "$DEP_STATUS" in
              SUCCESS|ACTIVE)
                echo ""
                echo "RAILWAY_DEPLOYMENT_STATUS=$DEP_STATUS"
                echo "RAILWAY_DEPLOYMENT = PASS — deployment reached $DEP_STATUS"
                break
                ;;
              FAILED|CRASHED|REMOVED|ERROR)
                echo ""
                echo "FAIL: Railway deployment $DEPLOY_ID reached terminal failure: $DEP_STATUS"
                echo "RAILWAY_DEPLOYMENT_ID=$DEPLOY_ID"
                echo "RAILWAY_DEPLOYMENT_STATUS=$DEP_STATUS"
                echo ""
                echo "===== FETCHING RAILWAY DEPLOYMENT LOGS ====="
                LOG_RESP=$(curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
                  -d "{\"query\":\"{deploymentLogs(deploymentId:\\\"$DEPLOY_ID\\\",filter:null,limit:500){message timestamp severity}}\"}" 2>/dev/null || echo '{"error":"curl failed"}')
                echo "--- RAW LOG RESPONSE (first 8000 chars) ---"
                echo "$LOG_RESP" | head -c 8000
                echo ""
                echo "--- PARSED MESSAGES ---"
                echo "$LOG_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); errs=d.get('errors',[]); [print('GRAPHQL ERROR:',e.get('message','')) for e in errs]; logs=(d.get('data') or {}).get('deploymentLogs',[]) or []; print('(no log entries returned)') if not logs else [print('['+e.get('severity','')+'] '+e.get('timestamp','')+' '+e.get('message','')) for e in logs]" 2>/dev/null || echo "(python3 parse failed — see RAW LOG RESPONSE above)"
                echo "===== END RAILWAY DEPLOYMENT LOGS ====="
                exit 1
                ;;
              UNKNOWN)
                echo "  (Could not parse status — check Railway API response)"
                echo "  Raw response: $STATUS_RESP"
                ;;
            esac

            if [ "$i" -eq 45 ]; then
              echo ""
              echo "TIMEOUT: Railway deployment $DEPLOY_ID did not reach SUCCESS within 15 minutes"
              echo "Last known status: $DEP_STATUS"
              exit 1
            fi

            echo "  Retrying in 20s..."
            sleep 20
          done

      - name: Print deployment summary before health poll
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          DIGEST="${{ needs.build-and-push.outputs.backend-digest }}"
          IMAGE="${{ env.BACKEND_IMAGE }}:$TAG"
          DEPLOY_ID="${{ steps.trigger-deploy.outputs.deployment-id }}"

          echo "===== DEPLOYMENT SUMMARY ====="
          echo "COMMIT_SHA=${{ github.sha }}"
          echo "EXPECTED_BACKEND_IMAGE=$IMAGE"
          echo "EXPECTED_IMAGE_DIGEST=$DIGEST"
          echo ""
          echo "RAILWAY_DEPLOYMENT_ID=$DEPLOY_ID"
          echo "RAILWAY_DEPLOYMENT=PASS (reached SUCCESS/ACTIVE)"
          echo ""
          echo "NOTE: Railway GraphQL does not expose Deployment.image."
          echo "      GHCR artifact verified by image digest from build step."
          echo "      Runtime image verified by backend health endpoint below."

      - name: Poll backend health until UP (deployment health gate)
        # Railway deployment is confirmed SUCCESS/ACTIVE — now verify the app itself.
        # Fails the job if the app doesn't report UP — backend crash is not a PASS.
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ] && [ -n "$API_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi

          if [ -z "$ACTUATOR_BASE_URL" ]; then
            echo "UAT_API_URL not set — skipping health poll (set it in Repository Variables)"
            echo "Waiting 120s for Railway cold start instead..."
            sleep 120
            exit 0
          fi

          HEALTH_URL="$ACTUATOR_BASE_URL/actuator/health"
          echo "Health gate: polling $HEALTH_URL (max 8 min, 20s interval)"
          echo "Railway deployment is already ACTIVE — app should be reachable shortly."
          echo "Waiting 30s initial delay for Tomcat to bind port..."
          sleep 30

          for i in $(seq 1 21); do
            HTTP=$(curl -s -o /tmp/health_deploy.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 "$HEALTH_URL" 2>/dev/null || echo "000")
            BODY=$(cat /tmp/health_deploy.json 2>/dev/null || echo "{}")
            STATUS=$(echo "$BODY" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")

            echo "Attempt $i/21 — HTTP $HTTP — status: ${STATUS:-?}"

            if [ "$HTTP" = "200" ] && [ "$STATUS" = "UP" ]; then
              echo ""
              echo "BACKEND_HEALTH_HTTP=200"
              echo "BACKEND_HEALTH_STATUS=UP"
              echo "DEPLOYMENT_HEALTH_GATE = PASS — backend is UP"
              exit 0
            fi

            if [ "$HTTP" = "502" ] || [ "$HTTP" = "503" ]; then
              if [ "$i" -ge 3 ]; then
                echo ""
                echo "RAILWAY_BACKEND_UNHEALTHY — HTTP $HTTP persists after $((i * 20 + 30))s"
                echo "The application failed to start. Check Railway deployment logs."
                echo "Common causes:"
                echo "  - JWT_PRIVATE_KEY or JWT_PUBLIC_KEY Railway Variable not set"
                echo "  - BeanCreationException for jwtTokenProvider"
                echo "  - Flyway migration failure"
                echo "  - Database connection failure"
                if [ "$HTTP" = "502" ]; then
                  echo "HTTP 502 = Railway gateway — container did not start successfully"
                fi
                echo "BACKEND_HEALTH_HTTP=$HTTP"
                echo "BACKEND_HEALTH_STATUS=DOWN"
                exit 1
              fi
            fi

            if [ "$HTTP" = "000" ]; then
              echo "  (connection refused / timeout — app may still be starting)"
            fi

            echo "  Retrying in 20s..."
            sleep 20
          done

          echo ""
          echo "TIMEOUT: Backend did not reach UP status within 8 minutes"
          echo "Railway deployment reached ACTIVE but Spring Boot failed to bind port."
          echo "BACKEND_HEALTH_HTTP=000"
          echo "BACKEND_HEALTH_STATUS=TIMEOUT"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # DB INTEGRITY GATE
  #
  # Security model:
  #   /actuator/health          — public (permitAll); used for liveness polling
  #   /actuator/health/dbIntegrity — protected (anyRequest().authenticated())
  #
  # CI authenticates with a dedicated service account (PLATFORM_ADMIN role)
  # bootstrapped at UAT startup by CiServiceAccountBootstrap from the
  # CI_SERVICE_EMAIL / CI_SERVICE_PASSWORD Railway env vars. The JWT obtained
  # here is ephemeral, never logged, and scoped to this CI run only.
  #
  # URL layout (explicit — no string-coincidence hacks):
  #   API_BASE_URL      = vars.UAT_API_URL             (e.g. https://host/v1)
  #   ACTUATOR_BASE_URL = vars.UAT_ACTUATOR_BASE_URL   (e.g. https://host)
  #   If UAT_ACTUATOR_BASE_URL is not set, derives it from UAT_API_URL by
  #   stripping the /v1 suffix as a fallback.
  # ─────────────────────────────────────────────────────────────────────────────
  db-integrity-gate:
    name: DB Integrity Gate
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ vars.UAT_API_URL != '' }}

    steps:
      - name: Poll backend until UP or timeout
        id: health_poll
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi
          HEALTH_URL="$ACTUATOR_BASE_URL/actuator/health"
          echo "API_BASE_URL:      $API_BASE_URL"
          echo "ACTUATOR_BASE_URL: $ACTUATOR_BASE_URL"
          echo "Polling $HEALTH_URL until backend reports UP (max 6 min, 20s interval)..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            BODY=$(cat /tmp/health.json 2>/dev/null || echo "{}")
            OVERALL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            echo "Attempt $i — HTTP $STATUS — overall: $OVERALL"
            if [ "$STATUS" = "200" ] && [ "$OVERALL" = "UP" ]; then
              echo "Backend is UP — proceeding to integrity check"
              exit 0
            fi
            if [ "$STATUS" = "503" ]; then
              echo "Backend returned 503 (DOWN) — DB or app failure"
              echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
              exit 1
            fi
            echo "Retrying in 20s..."
            sleep 20
          done
          echo "TIMEOUT: Backend did not reach UP status within 6 minutes"
          exit 1

      - name: Authenticate CI service account and validate DB integrity
        env:
          CI_SERVICE_EMAIL: ${{ secrets.CI_SERVICE_EMAIL }}
          CI_SERVICE_PASSWORD: ${{ secrets.CI_SERVICE_PASSWORD }}
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi
          COMPONENT_URL="$ACTUATOR_BASE_URL/actuator/health/dbIntegrity"

          echo "API_BASE_URL:      $API_BASE_URL"
          echo "ACTUATOR_BASE_URL: $ACTUATOR_BASE_URL"
          echo "Component URL:     $COMPONENT_URL"

          # ── Step A: Login with CI service account to obtain JWT ──────────────
          # Credentials are in env vars (masked by GitHub Actions — never echoed).
          # Written to a temp file to avoid shell interpolation in process table.
          if [ -z "$CI_SERVICE_EMAIL" ] || [ -z "$CI_SERVICE_PASSWORD" ]; then
            echo "FAIL: CI_SERVICE_EMAIL or CI_SERVICE_PASSWORD secret not configured."
            echo "      Add these secrets to the repository (Settings → Secrets → Actions)"
            echo "      and to Railway Variables so CiServiceAccountBootstrap can create the account."
            exit 1
          fi

          printf '{"email":"%s","password":"%s"}' "$CI_SERVICE_EMAIL" "$CI_SERVICE_PASSWORD" > /tmp/.ci_login.json
          LOGIN_HTTP=$(curl -s -o /tmp/.ci_login_resp.json -w "%{http_code}" \
            -X POST "$API_BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            --data @/tmp/.ci_login.json)
          rm -f /tmp/.ci_login.json

          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "FAIL: CI service account login failed — HTTP $LOGIN_HTTP"
            MSG=$(python3 -c "import json; d=json.load(open('/tmp/.ci_login_resp.json')); print(d.get('message','?'))" 2>/dev/null || echo "(no message)")
            echo "      Response message: $MSG"
            echo "      Ensure CI_SERVICE_EMAIL / CI_SERVICE_PASSWORD secrets match Railway vars"
            echo "      and that CiServiceAccountBootstrap ran successfully on this deployment."
            rm -f /tmp/.ci_login_resp.json
            exit 1
          fi

          CI_JWT=$(python3 -c "import json; d=json.load(open('/tmp/.ci_login_resp.json')); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          rm -f /tmp/.ci_login_resp.json

          if [ -z "$CI_JWT" ]; then
            echo "FAIL: CI login returned 200 but no accessToken in response"
            exit 1
          fi
          echo "::add-mask::$CI_JWT"
          echo "CI authentication: PASS"

          # ── Step B: Call /actuator/health/dbIntegrity with JWT ───────────────
          # CI_JWT is not logged — only used in the Authorization header.
          echo "Fetching $COMPONENT_URL (authenticated)"
          HTTP_STATUS=$(curl -s -o /tmp/db_integrity.json -w "%{http_code}" \
            -H "Authorization: Bearer $CI_JWT" \
            "$COMPONENT_URL" || echo "000")
          echo "HTTP status: $HTTP_STATUS"

          # ── Step C: Guard against non-200 before JSON parsing ────────────────
          if [ "$HTTP_STATUS" = "401" ]; then
            echo "FAIL: DB Integrity endpoint returned 401 Unauthorized"
            echo "      Possible causes:"
            echo "        - JWT token was rejected (check CiServiceAccountBootstrap)"
            echo "        - SecurityConfig does not grant authenticated access to this path"
            exit 1
          fi
          if [ "$HTTP_STATUS" = "403" ]; then
            echo "FAIL: DB Integrity endpoint returned 403 Forbidden"
            echo "      The CI service account lacks the required role"
            exit 1
          fi
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "FAIL: DB Integrity endpoint returned 404 — endpoint not registered"
            echo "      Check management.endpoints.web.exposure.include includes 'health'"
            echo "      and that DbIntegrityHealthIndicator is registered as component 'dbIntegrity'"
            exit 1
          fi
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "503" ]; then
            echo "FAIL: Unexpected HTTP status $HTTP_STATUS from DB Integrity endpoint"
            echo "Response body (first 500 chars):"
            head -c 500 /tmp/db_integrity.json 2>/dev/null || echo "(empty)"
            exit 1
          fi

          echo "Response body:"
          cat /tmp/db_integrity.json | python3 -m json.tool 2>/dev/null || cat /tmp/db_integrity.json

          # ── Step D: Parse and validate the integrity payload ─────────────────
          python3 << 'EOF'
          import json, sys

          with open('/tmp/db_integrity.json') as f:
              try:
                  data = json.load(f)
              except json.JSONDecodeError as e:
                  print(f"FAIL: Response is not valid JSON: {e}")
                  print("      This indicates the endpoint returned an unexpected body (e.g. HTML error page)")
                  sys.exit(1)

          details = data.get('details', {})
          component_status = data.get('status', 'UNKNOWN')

          print()
          print("=== DB INTEGRITY CHECK RESULTS ===")
          print(f"Component status: {component_status}")
          print()

          # Print all detail fields with FAIL markers
          for k in sorted(details.keys()):
              flag = " *** FAIL ***" if "FAIL" in str(k) else ""
              print(f"  {k}: {details[k]}{flag}")

          # Component itself reported DOWN
          if component_status == "DOWN":
              fail_keys = [k for k in details if "FAIL" in str(k)]
              print()
              print("=== DEPLOYMENT BLOCKED — DbIntegrityHealthIndicator returned DOWN ===")
              for k in fail_keys:
                  print(f"  {k}: {details[k]}")
              sys.exit(1)

          # Verify canonical counts
          failures = []
          checks = {
              'published_total':              (320, "Expected 320 PUBLISHED exams"),
              'year_3':                       (80,  "Expected 80 Year 3 exams"),
              'year_5':                       (80,  "Expected 80 Year 5 exams"),
              'year_7':                       (80,  "Expected 80 Year 7 exams"),
              'year_9':                       (80,  "Expected 80 Year 9 exams"),
              'package_FREE':                 (20,  "Expected 20 FREE exams"),
              'package_ADVANCED':             (100, "Expected 100 ADVANCED exams"),
              'package_PREMIUM':              (200, "Expected 200 PREMIUM exams"),
              'year_domain_pairs_wrong_count':(0,   "All year/domain pairs must have exactly 16 exams"),
              'published_without_questions':  (0,   "Zero published exams with no questions"),
              'audio_response_spelling':      (0,   "Zero AUDIO_RESPONSE in Spelling domain"),
          }

          for key, (expected, msg) in checks.items():
              actual = details.get(key)
              if actual is None:
                  failures.append(f"MISSING metric '{key}'\n    Expected: {expected}\n    Actual:   (not in response)\n    Check:    {msg}")
              elif int(actual) != expected:
                  failures.append(f"FAIL: {key}\n    Expected: {expected}\n    Actual:   {actual}\n    Check:    {msg}")
              else:
                  print(f"  PASS: {key} = {actual} ✓")

          if failures:
              print()
              print("=== DEPLOYMENT BLOCKED ===")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)

          print()
          print("=== ALL CANONICAL COUNTS VERIFIED ===")
          print("  PUBLISHED_EXAMS       = 320  ✓")
          print("  YEAR_3/5/7/9          = 80 each  ✓")
          print("  FREE/ADVANCED/PREMIUM = 20/100/200  ✓")
          print("  YEAR_DOMAIN_PAIRS     = 16 each  ✓")
          print("  EMPTY_PUBLISHED_EXAMS = 0  ✓")
          print("  AUDIO_RESPONSE_SPELL  = 0  ✓")
          print()
          print("DB_INTEGRITY_GATE = PASS")
          EOF

      - name: Verify API returns studentTestLength (not old questionCount)
        # Gate: confirm the NEWLY deployed code is running, not a cached old image.
        # The old AvailableExamResponse had `questionCount` (pool count).
        # The new AvailableExamResponse has `studentTestLength` (student-facing length).
        # If this check fails, old code is deployed — diagnose via Railway service source
        # and GHCR registry credentials (see GHCR_PACKAGE_VISIBILITY_FIX_REPORT.md).
        run: |
          BASE_URL="${{ vars.UAT_API_URL }}"
          TS=$(date +%s)
          EMAIL="ci_ver_${TS}@naplanprep-ci.test"
          PASS="CiVerify123!"

          # Register + login
          curl -s -o /dev/null --max-time 30 \
            -X POST "$BASE_URL/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"firstName\":\"CI\",\"lastName\":\"Verify\",\"role\":\"STUDENT\"}"

          LOGIN_HTTP=$(curl -s -o /tmp/ci_ver_login.json -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")

          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "FAIL: version-verify login returned HTTP $LOGIN_HTTP"
            exit 1
          fi

          VER_TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/ci_ver_login.json')); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          rm -f /tmp/ci_ver_login.json
          echo "::add-mask::$VER_TOKEN"

          if [ -z "$VER_TOKEN" ]; then
            echo "FAIL: version-verify login returned no accessToken"
            exit 1
          fi

          # Call catalogue
          CATALOG_HTTP=$(curl -s -o /tmp/ci_ver_catalog.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $VER_TOKEN" \
            "$BASE_URL/exams/available")

          if [ "$CATALOG_HTTP" != "200" ]; then
            echo "FAIL: /exams/available returned HTTP $CATALOG_HTTP"
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, sys
          with open('/tmp/ci_ver_catalog.json') as f:
              d = json.load(f)
          data = d.get('data', [])
          print(f"CATALOGUE_COUNT: {len(data)}")
          if not data:
              print("FAIL: empty catalogue")
              sys.exit(1)

          sample = data[0]
          keys = list(sample.keys())
          print(f"RESPONSE_FIELDS: {keys}")

          has_stl = 'studentTestLength' in keys
          has_qc  = 'questionCount' in keys

          if has_qc and not has_stl:
              print()
              print("FAIL: API returns 'questionCount' instead of 'studentTestLength'.")
              print("      OLD CODE IS DEPLOYED. The Railway service is running a cached image")
              print("      from before V381/V382 migrations were introduced.")
              print()
              print("      TO FIX:")
              print("      Railway cannot pull the private GHCR image. GHCR_READ_TOKEN (GitHub PAT,")
              print("      read:packages scope) must be set as a GitHub Actions secret so CI can")
              print("      configure Railway's GHCR pull credentials via serviceInstanceUpdate.")
              print("      1. Ensure GHCR_READ_TOKEN is set in Repository → Settings → Secrets → Actions")
              print("      2. Re-run CI — the 'Update Railway service source' step sets Railway credentials")
              print("         via GraphQL API (Railway UI has no credential field for existing services).")
              print("      See RAILWAY_GHCR_PRIVATE_REGISTRY_SETUP.md for PAT setup instructions.")
              print()
              print("      FORBIDDEN_POOL_COUNTS detected in response:")
              forbidden = {96, 112, 128, 104, 72, 43}
              pool_count_detected = set()
              for e in data:
                  qc = e.get('questionCount', 0)
                  if qc in forbidden:
                      pool_count_detected.add(qc)
              if pool_count_detected:
                  print(f"      Pool counts in API: {sorted(pool_count_detected)}")
              sys.exit(1)

          if not has_stl:
              print()
              print(f"FAIL: 'studentTestLength' field absent from API response. Fields: {keys}")
              print("      New code not deployed or AvailableExamResponse mapping is broken.")
              sys.exit(1)

          # Spot-check: verify no forbidden pool counts appear as studentTestLength
          forbidden = {96, 112, 128, 104, 72, 43}
          violations = [(e.get('domain'), e.get('yearLevel'), e.get('packageType'), e.get('studentTestLength'))
                        for e in data if e.get('studentTestLength') in forbidden]
          if violations:
              print()
              print("FAIL: studentTestLength contains forbidden pool counts:")
              for v in violations[:5]:
                  print(f"      domain={v[0]} year={v[1]} pkg={v[2]} studentTestLength={v[3]}")
              sys.exit(1)

          # Spot-check: null or zero studentTestLength
          null_count = sum(1 for e in data if not e.get('studentTestLength'))
          print(f"NULL_OR_ZERO_STUDENT_TEST_LENGTH: {null_count}")
          if null_count > 0:
              print("FAIL: some exams have NULL/zero studentTestLength — V381/V382/V384 may not have run")
              sys.exit(1)

          print()
          print("API_CODE_VERSION = PASS — studentTestLength present, no pool counts, no nulls")
          PYEOF
          rm -f /tmp/ci_ver_catalog.json

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [build-and-push, db-integrity-gate]
    if: needs.db-integrity-gate.result == 'success'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend to Vercel UAT
        run: |
          cd frontend
          UAT_API="${{ vars.UAT_API_URL }}"
          if [ -z "$UAT_API" ]; then UAT_API="https://naplanprep-backend-uat-uat.up.railway.app/v1"; fi
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL="$UAT_API" \
            --build-env VITE_STRIPE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --prod --yes
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-admin:
    name: Deploy Admin to Vercel
    runs-on: ubuntu-latest
    needs: [build-and-push, db-integrity-gate]
    if: needs.db-integrity-gate.result == 'success'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy admin to Vercel UAT
        run: |
          cd admin-panel
          UAT_API="${{ vars.UAT_API_URL }}"
          if [ -z "$UAT_API" ]; then UAT_API="https://naplanprep-backend-uat-uat.up.railway.app/v1"; fi
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL="$UAT_API" \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --prod --yes
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  smoke-test:
    name: Remote UAT Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-admin]
    if: ${{ vars.UAT_API_URL != '' }}

    steps:
      - name: Backend health (final confirmation)
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ] && [ -n "$API_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi
          HEALTH_URL="$ACTUATOR_BASE_URL/actuator/health"
          echo "STEP: Backend health"
          echo "  METHOD: GET"
          echo "  URL: $HEALTH_URL"
          HTTP=$(curl -s -o /tmp/health_final.json -w "%{http_code}" --max-time 30 "$HEALTH_URL" 2>/dev/null || echo "000")
          BODY=$(cat /tmp/health_final.json 2>/dev/null || echo "{}")
          echo "  HTTP: $HTTP"
          APP_STATUS=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "?")
          echo "  APP_STATUS: $APP_STATUS"
          if [ "$HTTP" != "200" ] || [ "$APP_STATUS" != "UP" ]; then
            echo "  RESULT: FAIL"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY" | head -c 500
            exit 1
          fi
          echo "  RESULT: PASS"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || true

      - name: Plans API (public endpoint)
        run: |
          PLANS_URL="${{ vars.UAT_API_URL }}/subscriptions/plans"
          echo "STEP: Plans API"
          echo "  METHOD: GET"
          echo "  URL: $PLANS_URL"
          HTTP=$(curl -s -o /tmp/plans_resp.json -w "%{http_code}" --max-time 30 "$PLANS_URL" 2>/dev/null || echo "000")
          BODY=$(cat /tmp/plans_resp.json 2>/dev/null || echo "{}")
          echo "  HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "  RESULT: FAIL — unexpected HTTP $HTTP"
            echo "  RESPONSE: $(echo "$BODY" | head -c 500)"
            exit 1
          fi
          COUNT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])))" 2>/dev/null || echo "0")
          echo "  Plans returned: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "  RESULT: FAIL — no subscription plans returned"
            exit 1
          fi
          echo "  RESULT: PASS"

      - name: Register smoke test user and verify FREE catalog
        # Endpoint facts (from ExamController.java):
        #   GET /v1/exams/available  -> ApiResponse<List<AvailableExamResponse>>
        #   data is a plain List (NOT paginated); no totalElements/content fields
        #   availability field values: AVAILABLE | UPCOMING | EXPIRED | UPGRADE_REQUIRED
        #   POST /v1/auth/register   -> 201 Created
        run: |
          BASE_URL="${{ vars.UAT_API_URL }}"
          TIMESTAMP=$(date +%s)
          EMAIL="smoke_${TIMESTAMP}@naplanprep-ci.test"
          PASSWORD="SmokeTest123!"

          echo "STEP 1: Register"
          echo "  METHOD: POST"
          echo "  URL: $BASE_URL/auth/register"
          REG_HTTP=$(curl -s -o /tmp/reg_resp.json -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"firstName\":\"Smoke\",\"lastName\":\"Test\",\"role\":\"STUDENT\"}" 2>/dev/null || echo "000")
          echo "  REGISTER_HTTP_STATUS=$REG_HTTP"
          case "$REG_HTTP" in
            201) echo "  RESULT: PASS (201 Created)" ;;
            200) echo "  RESULT: PASS (200 OK)" ;;
            409) echo "  RESULT: NOTE — 409 Conflict (user already exists; expected on re-run)" ;;
            *)
              echo "  RESULT: FAIL — unexpected HTTP $REG_HTTP"
              echo "  RESPONSE (first 500 chars):"
              cat /tmp/reg_resp.json 2>/dev/null | head -c 500
              exit 1
              ;;
          esac

          echo ""
          echo "STEP 2: Login"
          echo "  METHOD: POST"
          echo "  URL: $BASE_URL/auth/login"
          printf '{"email":"%s","password":"%s"}' "$EMAIL" "$PASSWORD" > /tmp/.smoke_creds.json
          LOGIN_HTTP=$(curl -s -o /tmp/login_resp.json -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            --data @/tmp/.smoke_creds.json 2>/dev/null || echo "000")
          rm -f /tmp/.smoke_creds.json
          echo "  HTTP: $LOGIN_HTTP"
          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "  RESULT: FAIL — unexpected HTTP $LOGIN_HTTP"
            echo "  RESPONSE (data redacted, first 500 chars):"
            python3 -c "import json; d=json.load(open('/tmp/login_resp.json')); d.pop('data',None); print(json.dumps(d))" 2>/dev/null || cat /tmp/login_resp.json | head -c 500
            exit 1
          fi
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/login_resp.json')); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          rm -f /tmp/login_resp.json
          if [ -z "$TOKEN" ]; then
            echo "  RESULT: FAIL — HTTP 200 but no accessToken in response"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "  RESULT: PASS — JWT obtained"
          echo "Login: PASS — JWT obtained"

          echo ""
          echo "STEP 3: Exam catalog (GET /exams/available)"
          echo "  METHOD: GET"
          echo "  URL: $BASE_URL/exams/available"
          echo "  AUTH: Bearer [masked]"
          CATALOG_HTTP=$(curl -s -o /tmp/catalog_resp.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/exams/available" 2>/dev/null || echo "000")
          CATALOG_BODY=$(cat /tmp/catalog_resp.json 2>/dev/null || echo "{}")
          echo "  HTTP: $CATALOG_HTTP"
          if [ "$CATALOG_HTTP" != "200" ]; then
            echo "  RESULT: FAIL"
            echo "  FAILED_REQUEST: GET $BASE_URL/exams/available"
            echo "  FAILED_HTTP_STATUS: $CATALOG_HTTP"
            echo "  FAILED_RESPONSE (first 1000 chars):"
            echo "$CATALOG_BODY" | head -c 1000
            exit 1
          fi
          CATALOG_TOTAL=$(echo "$CATALOG_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])))" 2>/dev/null || echo "?")
          CATALOG_AVAIL=$(echo "$CATALOG_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len([x for x in d.get('data',[]) if x.get('availability')=='AVAILABLE']))" 2>/dev/null || echo "?")
          echo "  RESULT: PASS"
          echo "  Catalog total (all statuses): $CATALOG_TOTAL"
          echo "  AVAILABLE to FREE user: $CATALOG_AVAIL"
          echo "Remote FREE catalog check complete"

      - name: Start a spelling exam (SHORT_ANSWER verification)
        # Endpoint facts (from ExamController.java):
        #   POST /v1/exams/{examId}/start  -> 201 Created, data.sessionId
        #   GET /v1/exams/sessions/{id}/questions -> 200, data: List<QuestionSummary>
        run: |
          BASE_URL="${{ vars.UAT_API_URL }}"
          TIMESTAMP=$(date +%s)
          EMAIL="spell_${TIMESTAMP}@naplanprep-ci.test"
          PASSWORD="SpellTest123!"

          echo "STEP 1: Register spelling test user"
          echo "  METHOD: POST"
          echo "  URL: $BASE_URL/auth/register"
          REG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"firstName\":\"Spell\",\"lastName\":\"Test\",\"role\":\"STUDENT\"}" 2>/dev/null || echo "000")
          echo "  HTTP: $REG_HTTP"
          case "$REG_HTTP" in
            200|201|409) echo "  RESULT: OK ($REG_HTTP)" ;;
            *)
              echo "  RESULT: FAIL — unexpected HTTP $REG_HTTP"
              exit 1
              ;;
          esac

          echo ""
          echo "STEP 2: Login spelling test user"
          echo "  METHOD: POST"
          echo "  URL: $BASE_URL/auth/login"
          printf '{"email":"%s","password":"%s"}' "$EMAIL" "$PASSWORD" > /tmp/.spell_creds.json
          LOGIN_HTTP=$(curl -s -o /tmp/spell_login.json -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            --data @/tmp/.spell_creds.json 2>/dev/null || echo "000")
          rm -f /tmp/.spell_creds.json
          echo "  HTTP: $LOGIN_HTTP"
          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "  RESULT: FAIL — HTTP $LOGIN_HTTP"
            exit 1
          fi
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/spell_login.json')); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          rm -f /tmp/spell_login.json
          if [ -z "$TOKEN" ]; then echo "  RESULT: FAIL — no accessToken"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "  RESULT: PASS"

          echo ""
          echo "STEP 3: Get exam catalog"
          echo "  METHOD: GET"
          echo "  URL: $BASE_URL/exams/available"
          echo "  AUTH: Bearer [masked]"
          CATALOG_HTTP=$(curl -s -o /tmp/spell_catalog.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/exams/available" 2>/dev/null || echo "000")
          echo "  HTTP: $CATALOG_HTTP"
          if [ "$CATALOG_HTTP" != "200" ]; then
            echo "  RESULT: FAIL — unexpected HTTP $CATALOG_HTTP"
            cat /tmp/spell_catalog.json 2>/dev/null | head -c 500
            exit 1
          fi
          SPELLING_EXAM=$(python3 -c "import json; d=json.load(open('/tmp/spell_catalog.json')); items=d.get('data',[]); found=[x.get('id','') for x in items if 'Spelling' in x.get('title','') and 'Year 3' in x.get('title','') and ('Free' in x.get('title','') or x.get('availability','')=='AVAILABLE')]; print(found[0] if found else '')" 2>/dev/null || echo "")
          if [ -z "$SPELLING_EXAM" ]; then
            echo "  Could not find Year 3 Spelling Free exam in catalog — skipping spelling session test"
            exit 0
          fi
          echo "  Found Spelling exam ID: $SPELLING_EXAM"

          echo ""
          echo "STEP 4: Start spelling exam"
          echo "  METHOD: POST"
          echo "  URL: $BASE_URL/exams/$SPELLING_EXAM/start"
          echo "  AUTH: Bearer [masked]"
          SESSION_HTTP=$(curl -s -o /tmp/spell_session.json -w "%{http_code}" --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "$BASE_URL/exams/$SPELLING_EXAM/start" 2>/dev/null || echo "000")
          SESSION_BODY=$(cat /tmp/spell_session.json 2>/dev/null || echo "{}")
          echo "  HTTP: $SESSION_HTTP"
          if [ "$SESSION_HTTP" != "201" ] && [ "$SESSION_HTTP" != "200" ]; then
            echo "  RESULT: FAIL — unexpected HTTP $SESSION_HTTP"
            echo "  FAILED_REQUEST: POST $BASE_URL/exams/$SPELLING_EXAM/start"
            echo "  FAILED_HTTP_STATUS: $SESSION_HTTP"
            echo "  FAILED_RESPONSE (first 500 chars, questions omitted):"
            python3 -c "import json; d=json.load(open('/tmp/spell_session.json')); d.get('data',{}).pop('questions',None); print(json.dumps(d))" 2>/dev/null || echo "$SESSION_BODY" | head -c 500
            exit 1
          fi
          SESSION_ID=$(echo "$SESSION_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('sessionId',''))" 2>/dev/null || echo "")
          if [ -z "$SESSION_ID" ]; then
            echo "  RESULT: FAIL — no sessionId in start response"
            python3 -c "import json; d=json.load(open('/tmp/spell_session.json')); d.get('data',{}).pop('questions',None); print(json.dumps(d))" 2>/dev/null || echo "$SESSION_BODY" | head -c 500
            exit 1
          fi
          echo "  RESULT: PASS"
          echo "  Session started: $SESSION_ID"

          echo ""
          echo "STEP 5: Get session questions"
          echo "  METHOD: GET"
          echo "  URL: $BASE_URL/exams/sessions/$SESSION_ID/questions"
          echo "  AUTH: Bearer [masked]"
          QUESTIONS_HTTP=$(curl -s -o /tmp/spell_questions.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/exams/sessions/$SESSION_ID/questions" 2>/dev/null || echo "000")
          echo "  HTTP: $QUESTIONS_HTTP"
          if [ "$QUESTIONS_HTTP" != "200" ]; then
            echo "  RESULT: FAIL — unexpected HTTP $QUESTIONS_HTTP"
            echo "  FAILED_REQUEST: GET $BASE_URL/exams/sessions/$SESSION_ID/questions"
            echo "  FAILED_HTTP_STATUS: $QUESTIONS_HTTP"
            cat /tmp/spell_questions.json 2>/dev/null | head -c 500
            exit 1
          fi
          FIRST_TYPE=$(python3 -c "import json; d=json.load(open('/tmp/spell_questions.json')); qs=d.get('data',[]); print(qs[0].get('questionType','?') if qs else 'NO_QUESTIONS')" 2>/dev/null || echo "?")
          echo "  RESULT: PASS"
          echo "  First question type: $FIRST_TYPE"
          if [ "$FIRST_TYPE" = "AUDIO_RESPONSE" ]; then
            echo "FAIL: AUDIO_RESPONSE still present in Spelling exam — V379 migration not applied"
            exit 1
          fi
          echo "Spelling SHORT_ANSWER check: PASS (type=$FIRST_TYPE)"

      - name: Verify studentTestLength — pool counts must NOT appear in catalog
        # FAIL-FAST: if any exam exposes a pool count as studentTestLength, the
        # V381/V382 migration has not run and UAT is broken.
        # Authoritative values: NUM Y3=36 Y5=42 Y7/Y9=48; READ Y3/Y5=39 Y7/Y9=48;
        #                       SPELLING=25; GRAMMAR_PUNCTUATION=27; WRITING=1
        run: |
          BASE_URL="${{ vars.UAT_API_URL }}"
          TIMESTAMP=$(date +%s)
          EMAIL="catcheck_${TIMESTAMP}@naplanprep-ci.test"
          PASSWORD="CatCheck123!"

          printf '{"email":"%s","password":"%s","firstName":"Cat","lastName":"Check","role":"STUDENT"}' \
            "$EMAIL" "$PASSWORD" > /tmp/.catcheck_reg.json
          curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/register" \
            -H "Content-Type: application/json" \
            --data @/tmp/.catcheck_reg.json > /dev/null || true
          rm -f /tmp/.catcheck_reg.json

          printf '{"email":"%s","password":"%s"}' "$EMAIL" "$PASSWORD" > /tmp/.catcheck_creds.json
          LOGIN_HTTP=$(curl -s -o /tmp/catcheck_login.json -w "%{http_code}" --max-time 30 \
            -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            --data @/tmp/.catcheck_creds.json 2>/dev/null || echo "000")
          rm -f /tmp/.catcheck_creds.json
          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "FAIL: login returned $LOGIN_HTTP — skipping studentTestLength check"
            exit 1
          fi
          TOKEN=$(python3 -c "import json; d=json.load(open('/tmp/catcheck_login.json')); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          rm -f /tmp/catcheck_login.json
          echo "::add-mask::$TOKEN"

          curl -s -o /tmp/cat_check.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE_URL/exams/available" > /tmp/cat_check_http.txt 2>/dev/null || echo "000" > /tmp/cat_check_http.txt
          CAT_HTTP=$(cat /tmp/cat_check_http.txt)
          if [ "$CAT_HTTP" != "200" ]; then
            echo "FAIL: GET /exams/available returned HTTP $CAT_HTTP"
            exit 1
          fi

          python3 << 'EOF'
          import json, sys

          with open('/tmp/cat_check.json') as f:
              data = json.load(f)

          exams = data.get('data', [])
          print(f"Total exams in catalog: {len(exams)}")

          # Pool counts that MUST NOT appear as studentTestLength
          FORBIDDEN = {128, 112, 96, 104, 72, 43}
          # Authoritative expected values
          EXPECTED = {
              ('NUMERACY', 3): 36, ('NUMERACY', 5): 42,
              ('NUMERACY', 7): 48, ('NUMERACY', 9): 48,
              ('READING',  3): 39, ('READING',  5): 39,
              ('READING',  7): 48, ('READING',  9): 48,
              ('SPELLING', 3): 25, ('SPELLING', 5): 25,
              ('SPELLING', 7): 25, ('SPELLING', 9): 25,
              ('WRITING',  3):  1, ('WRITING',  5):  1,
              ('WRITING',  7):  1, ('WRITING',  9):  1,
              ('GRAMMAR_PUNCTUATION', 3): 27, ('GRAMMAR_PUNCTUATION', 5): 27,
              ('GRAMMAR_PUNCTUATION', 7): 27, ('GRAMMAR_PUNCTUATION', 9): 27,
          }

          failures = []
          pool_count_violations = []
          missing_field = []

          for e in exams:
              domain = e.get('domain', '')
              year = e.get('yearLevel')
              stl = e.get('studentTestLength')
              title = e.get('title', '?')

              if stl is None:
                  missing_field.append(f"  {domain} Y{year} '{title}' — studentTestLength is NULL")
                  continue

              if stl in FORBIDDEN:
                  pool_count_violations.append(
                      f"  FAIL: {domain} Y{year} '{title}' studentTestLength={stl} (POOL COUNT EXPOSED)")

              key = (domain, year)
              if key in EXPECTED and stl != EXPECTED[key]:
                  failures.append(
                      f"  FAIL: {domain} Y{year} '{title}' expected={EXPECTED[key]} actual={stl}")

          if missing_field:
              print("MISSING studentTestLength field:")
              for m in missing_field: print(m)

          if pool_count_violations:
              print()
              print("=== DEPLOYMENT BLOCKED — POOL COUNTS EXPOSED AS studentTestLength ===")
              print("V381/V382 migration has NOT run. UAT is showing pool counts, not student test lengths.")
              for v in pool_count_violations: print(v)
              sys.exit(1)

          if failures:
              print()
              print("=== DEPLOYMENT BLOCKED — INCORRECT studentTestLength VALUES ===")
              for f in failures: print(f)
              sys.exit(1)

          if missing_field:
              print()
              print("WARN: Some exams have NULL studentTestLength — check V381/V382 migrations")
              sys.exit(1)

          print()
          print("STUDENT_TEST_LENGTH_GATE = PASS")
          print("  No pool counts exposed. All sampled values match expected student test lengths.")
          EOF

      - name: Summary
        run: |
          echo ""
          echo "=== REMOTE UAT SMOKE TEST SUMMARY ==="
          echo "  Backend health          : PASS"
          echo "  Plans API               : PASS"
          echo "  Auth flow               : PASS"
          echo "  DB integrity gate       : PASS (validated in previous job)"
          echo "  Spelling type           : PASS (SHORT_ANSWER, no AUDIO_RESPONSE)"
          echo "  studentTestLength gate  : PASS (no pool counts exposed)"
          echo ""
          echo "REMOTE_UAT_READY = YES (pending full manual UAT sign-off)"

  # ─────────────────────────────────────────────────────────────────────────────
  # UAT REGRESSION SUITE
  #
  # Runs the naplanprep-tests REST Assured + Playwright suite against the
  # freshly deployed UAT environment.
  #
  # Prerequisites:
  #   - TESTS_REPO_TOKEN secret: PAT with actions:read + repo:read on the
  #     naplanprep-tests repository (if private). Omit if repo is public
  #     (GITHUB_TOKEN can read public repos).
  #   - UAT_TESTS_REPO_OWNER variable (optional): GitHub org/user owning
  #     naplanprep-tests. Defaults to this repo's owner.
  #   - UAT_API_URL variable: backend base URL (used as api.base.url)
  #   - UAT_FRONTEND_URL variable: frontend base URL (used as BASE_URL)
  # ─────────────────────────────────────────────────────────────────────────────
  run-uat-regression:
    name: UAT Regression Suite (naplanprep-tests)
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: needs.smoke-test.result == 'success' && vars.UAT_API_URL != ''
    permissions:
      contents: read

    steps:
      - name: Checkout naplanprep-tests
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ vars.UAT_TESTS_REPO_OWNER != '' && format('{0}/naplanprep-tests', vars.UAT_TESTS_REPO_OWNER) || format('{0}/naplanprep-tests', github.repository_owner) }}
          token: ${{ secrets.TESTS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: naplanprep-tests

      - name: Set up Java 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run REST Assured API tests (studentTestLength regression)
        working-directory: naplanprep-tests/api-tests
        env:
          API_BASE_URL: ${{ vars.UAT_API_URL }}
        run: |
          mvn test \
            -Dapi.base.url="${{ vars.UAT_API_URL }}" \
            -pl . \
            --no-transfer-progress \
            2>&1 | tee /tmp/api-test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== API TEST FAILURES ==="
            grep -E "FAIL|ERROR|Tests run" /tmp/api-test-output.txt | head -50
            echo "API_REGRESSION_TESTS = FAIL"
            exit $EXIT_CODE
          fi
          echo "API_REGRESSION_TESTS = PASS"

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-api-test-results
          path: naplanprep-tests/api-tests/target/surefire-reports/
          retention-days: 14

      - name: Set up Node.js (for Playwright)
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: naplanprep-tests/playwright/package.json

      - name: Install Playwright dependencies
        working-directory: naplanprep-tests/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: naplanprep-tests/playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests (@smoke — includes studentTestLength UI checks)
        working-directory: naplanprep-tests/playwright
        env:
          BASE_URL: ${{ vars.UAT_FRONTEND_URL || 'https://frontend-nu-topaz-20.vercel.app' }}
          API_URL: ${{ vars.UAT_API_URL }}
          STUDENT_FREE_EMAIL: student1@test.com
          STUDENT_FREE_PASSWORD: Admin123!
          STUDENT_STANDARD_EMAIL: student3@test.com
          STUDENT_STANDARD_PASSWORD: Admin123!
        run: |
          npx playwright test --grep @smoke --project=chromium \
            2>&1 | tee /tmp/pw-smoke-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== PLAYWRIGHT SMOKE TEST FAILURES ==="
            grep -E "FAIL|Error:|✕|●" /tmp/pw-smoke-output.txt | head -50
            echo "PLAYWRIGHT_SMOKE_TESTS = FAIL"
            exit $EXIT_CODE
          fi
          echo "PLAYWRIGHT_SMOKE_TESTS = PASS"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-playwright-report
          path: naplanprep-tests/playwright/playwright-report/
          retention-days: 14
