name: Deploy — UAT

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-frontend
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-admin
  RAILWAY_API: https://backboard.railway.app/graphql/v2
  RAILWAY_PROJECT_ID: fc40e9ef-0983-4774-b3ec-7ec138bb370a
  RAILWAY_ENV_ID: 588e636a-0be4-4fee-8a7e-02ce26f5ec6f
  RAILWAY_BACKEND_SERVICE_ID: 58b84f41-861e-41e1-9440-e73d5a54e18b

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "tag=uat-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build & push backend
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.UAT_API_URL || 'https://naplanprep-backend-uat-uat.up.railway.app/v1' }}
            VITE_STRIPE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./admin-panel
          push: true
          build-args: |
            VITE_API_URL=${{ vars.UAT_API_URL || 'https://naplanprep-backend-uat-uat.up.railway.app/v1' }}
          tags: |
            ${{ env.ADMIN_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.ADMIN_IMAGE }}:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Set env vars on Railway
        run: |
          # Only upsert if value is non-empty — preserves existing Railway values
          # when a GitHub secret is not yet configured for this repo.
          railway_var() {
            if [ -z "$2" ]; then
              echo "Skipping $1 — secret not configured (existing Railway value preserved)"
              return 0
            fi
            curl -s --max-time 30 -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d "{\"query\":\"mutation{variableUpsert(input:{projectId:\\\"${{ env.RAILWAY_PROJECT_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",name:\\\"$1\\\",value:\\\"$2\\\"})}\"}"\
              > /dev/null && echo "Set $1" || echo "Warning: failed to set $1 (env var may already be set in Railway)"
          }
          railway_var "STRIPE_SECRET_KEY"         "${{ secrets.STRIPE_TEST_SECRET_KEY }}"
          railway_var "STRIPE_WEBHOOK_SECRET"     "${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}"
          railway_var "STRIPE_PUBLISHABLE_KEY"    "${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}"
          railway_var "STRIPE_ADVANCED_PRICE_ID"  "${{ secrets.STRIPE_TEST_ADVANCED_PRICE_ID }}"
          railway_var "STRIPE_PRO_PRICE_ID"       "${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}"
          railway_var "SPRING_PROFILES_ACTIVE"    "uat"
          # CI service account — bootstrapped by CiServiceAccountBootstrap at startup
          railway_var "CI_SERVICE_EMAIL"          "${{ secrets.CI_SERVICE_EMAIL }}"
          railway_var "CI_SERVICE_PASSWORD"       "${{ secrets.CI_SERVICE_PASSWORD }}"
          echo "Env var step complete (failures are non-fatal — vars persist in Railway)"

      - name: Update Railway service image (clear startCommand — use Docker ENTRYPOINT)
        run: |
          # startCommand:null clears any previously set Railway override so that the
          # Docker ENTRYPOINT (/bin/sh /app/entrypoint.sh) is authoritative.
          # The old startCommand "java ... -jar app.jar" bypassed entrypoint.sh and
          # prevented JWT key materialisation — this mutation removes that override.
          curl -sf -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"mutation{serviceInstanceUpdate(serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",input:{source:{image:\\\"${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image-tag }}\\\"},startCommand:null})}\"}"

      - name: Trigger Railway redeployment
        run: |
          curl -sf -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"mutation{environmentTriggersDeploy(input:{projectId:\\\"${{ env.RAILWAY_PROJECT_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\"})}\"}"

      - name: Poll backend health until UP (deployment health gate)
        run: |
          # Replace the static 360s sleep with active health polling.
          # Fails the deploy-backend job if the app doesn't become healthy —
          # "Deploy Backend = PASS" means the app is actually UP, not just submitted.
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ] && [ -n "$API_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi

          if [ -z "$ACTUATOR_BASE_URL" ]; then
            echo "UAT_API_URL not set — skipping health poll (set it in Repository Variables)"
            echo "Waiting 360s for Railway cold start instead..."
            sleep 360
            exit 0
          fi

          HEALTH_URL="$ACTUATOR_BASE_URL/actuator/health"
          echo "Health gate: polling $HEALTH_URL (max 8 min, 20s interval)"
          echo "Waiting 60s initial delay for Railway to pull and start the image..."
          sleep 60

          for i in $(seq 1 21); do
            HTTP=$(curl -s -o /tmp/health_deploy.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 15 "$HEALTH_URL" 2>/dev/null || echo "000")
            BODY=$(cat /tmp/health_deploy.json 2>/dev/null || echo "{}")
            STATUS=$(echo "$BODY" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")

            echo "Attempt $i/21 — HTTP $HTTP — status: ${STATUS:-?}"

            if [ "$HTTP" = "200" ] && [ "$STATUS" = "UP" ]; then
              echo ""
              echo "DEPLOYMENT_HEALTH_GATE = PASS — backend is UP"
              exit 0
            fi

            if [ "$HTTP" = "502" ] || [ "$HTTP" = "503" ]; then
              if [ "$i" -ge 3 ]; then
                echo ""
                echo "RAILWAY_BACKEND_UNHEALTHY — HTTP $HTTP persists after $((i * 20 + 60))s"
                echo "The application failed to start. Check Railway deployment logs."
                echo "Common causes:"
                echo "  - JWT_PRIVATE_KEY or JWT_PUBLIC_KEY Railway Variable not set"
                echo "  - BeanCreationException for jwtTokenProvider"
                echo "  - Flyway migration failure"
                echo "  - Database connection failure"
                if [ "$HTTP" = "502" ]; then
                  echo "HTTP 502 = Railway gateway — container did not start successfully"
                fi
                exit 1
              fi
            fi

            if [ "$HTTP" = "000" ]; then
              echo "  (connection refused / timeout — Railway may still be pulling image)"
            fi

            echo "  Retrying in 20s..."
            sleep 20
          done

          echo ""
          echo "TIMEOUT: Backend did not reach UP status within 8 minutes"
          echo "Railway deployment may still be in progress — check Railway dashboard"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # DB INTEGRITY GATE
  #
  # Security model:
  #   /actuator/health          — public (permitAll); used for liveness polling
  #   /actuator/health/dbIntegrity — protected (anyRequest().authenticated())
  #
  # CI authenticates with a dedicated service account (PLATFORM_ADMIN role)
  # bootstrapped at UAT startup by CiServiceAccountBootstrap from the
  # CI_SERVICE_EMAIL / CI_SERVICE_PASSWORD Railway env vars. The JWT obtained
  # here is ephemeral, never logged, and scoped to this CI run only.
  #
  # URL layout (explicit — no string-coincidence hacks):
  #   API_BASE_URL      = vars.UAT_API_URL             (e.g. https://host/v1)
  #   ACTUATOR_BASE_URL = vars.UAT_ACTUATOR_BASE_URL   (e.g. https://host)
  #   If UAT_ACTUATOR_BASE_URL is not set, derives it from UAT_API_URL by
  #   stripping the /v1 suffix as a fallback.
  # ─────────────────────────────────────────────────────────────────────────────
  db-integrity-gate:
    name: DB Integrity Gate
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ vars.UAT_API_URL != '' }}

    steps:
      - name: Poll backend until UP or timeout
        id: health_poll
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi
          HEALTH_URL="$ACTUATOR_BASE_URL/actuator/health"
          echo "API_BASE_URL:      $API_BASE_URL"
          echo "ACTUATOR_BASE_URL: $ACTUATOR_BASE_URL"
          echo "Polling $HEALTH_URL until backend reports UP (max 6 min, 20s interval)..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTH_URL" || echo "000")
            BODY=$(cat /tmp/health.json 2>/dev/null || echo "{}")
            OVERALL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            echo "Attempt $i — HTTP $STATUS — overall: $OVERALL"
            if [ "$STATUS" = "200" ] && [ "$OVERALL" = "UP" ]; then
              echo "Backend is UP — proceeding to integrity check"
              exit 0
            fi
            if [ "$STATUS" = "503" ]; then
              echo "Backend returned 503 (DOWN) — DB or app failure"
              echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
              exit 1
            fi
            echo "Retrying in 20s..."
            sleep 20
          done
          echo "TIMEOUT: Backend did not reach UP status within 6 minutes"
          exit 1

      - name: Authenticate CI service account and validate DB integrity
        env:
          CI_SERVICE_EMAIL: ${{ secrets.CI_SERVICE_EMAIL }}
          CI_SERVICE_PASSWORD: ${{ secrets.CI_SERVICE_PASSWORD }}
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi
          COMPONENT_URL="$ACTUATOR_BASE_URL/actuator/health/dbIntegrity"

          echo "API_BASE_URL:      $API_BASE_URL"
          echo "ACTUATOR_BASE_URL: $ACTUATOR_BASE_URL"
          echo "Component URL:     $COMPONENT_URL"

          # ── Step A: Login with CI service account to obtain JWT ──────────────
          # Credentials are in env vars (masked by GitHub Actions — never echoed).
          # Written to a temp file to avoid shell interpolation in process table.
          if [ -z "$CI_SERVICE_EMAIL" ] || [ -z "$CI_SERVICE_PASSWORD" ]; then
            echo "FAIL: CI_SERVICE_EMAIL or CI_SERVICE_PASSWORD secret not configured."
            echo "      Add these secrets to the repository (Settings → Secrets → Actions)"
            echo "      and to Railway Variables so CiServiceAccountBootstrap can create the account."
            exit 1
          fi

          printf '{"email":"%s","password":"%s"}' "$CI_SERVICE_EMAIL" "$CI_SERVICE_PASSWORD" > /tmp/.ci_login.json
          LOGIN_HTTP=$(curl -s -o /tmp/.ci_login_resp.json -w "%{http_code}" \
            -X POST "$API_BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            --data @/tmp/.ci_login.json)
          rm -f /tmp/.ci_login.json

          if [ "$LOGIN_HTTP" != "200" ]; then
            echo "FAIL: CI service account login failed — HTTP $LOGIN_HTTP"
            MSG=$(python3 -c "import json; d=json.load(open('/tmp/.ci_login_resp.json')); print(d.get('message','?'))" 2>/dev/null || echo "(no message)")
            echo "      Response message: $MSG"
            echo "      Ensure CI_SERVICE_EMAIL / CI_SERVICE_PASSWORD secrets match Railway vars"
            echo "      and that CiServiceAccountBootstrap ran successfully on this deployment."
            rm -f /tmp/.ci_login_resp.json
            exit 1
          fi

          CI_JWT=$(python3 -c "import json; d=json.load(open('/tmp/.ci_login_resp.json')); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          rm -f /tmp/.ci_login_resp.json

          if [ -z "$CI_JWT" ]; then
            echo "FAIL: CI login returned 200 but no accessToken in response"
            exit 1
          fi
          echo "::add-mask::$CI_JWT"
          echo "CI authentication: PASS"

          # ── Step B: Call /actuator/health/dbIntegrity with JWT ───────────────
          # CI_JWT is not logged — only used in the Authorization header.
          echo "Fetching $COMPONENT_URL (authenticated)"
          HTTP_STATUS=$(curl -s -o /tmp/db_integrity.json -w "%{http_code}" \
            -H "Authorization: Bearer $CI_JWT" \
            "$COMPONENT_URL" || echo "000")
          echo "HTTP status: $HTTP_STATUS"

          # ── Step C: Guard against non-200 before JSON parsing ────────────────
          if [ "$HTTP_STATUS" = "401" ]; then
            echo "FAIL: DB Integrity endpoint returned 401 Unauthorized"
            echo "      Possible causes:"
            echo "        - JWT token was rejected (check CiServiceAccountBootstrap)"
            echo "        - SecurityConfig does not grant authenticated access to this path"
            exit 1
          fi
          if [ "$HTTP_STATUS" = "403" ]; then
            echo "FAIL: DB Integrity endpoint returned 403 Forbidden"
            echo "      The CI service account lacks the required role"
            exit 1
          fi
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "FAIL: DB Integrity endpoint returned 404 — endpoint not registered"
            echo "      Check management.endpoints.web.exposure.include includes 'health'"
            echo "      and that DbIntegrityHealthIndicator is registered as component 'dbIntegrity'"
            exit 1
          fi
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "503" ]; then
            echo "FAIL: Unexpected HTTP status $HTTP_STATUS from DB Integrity endpoint"
            echo "Response body (first 500 chars):"
            head -c 500 /tmp/db_integrity.json 2>/dev/null || echo "(empty)"
            exit 1
          fi

          echo "Response body:"
          cat /tmp/db_integrity.json | python3 -m json.tool 2>/dev/null || cat /tmp/db_integrity.json

          # ── Step D: Parse and validate the integrity payload ─────────────────
          python3 << 'EOF'
          import json, sys

          with open('/tmp/db_integrity.json') as f:
              try:
                  data = json.load(f)
              except json.JSONDecodeError as e:
                  print(f"FAIL: Response is not valid JSON: {e}")
                  print("      This indicates the endpoint returned an unexpected body (e.g. HTML error page)")
                  sys.exit(1)

          details = data.get('details', {})
          component_status = data.get('status', 'UNKNOWN')

          print()
          print("=== DB INTEGRITY CHECK RESULTS ===")
          print(f"Component status: {component_status}")
          print()

          # Print all detail fields with FAIL markers
          for k in sorted(details.keys()):
              flag = " *** FAIL ***" if "FAIL" in str(k) else ""
              print(f"  {k}: {details[k]}{flag}")

          # Component itself reported DOWN
          if component_status == "DOWN":
              fail_keys = [k for k in details if "FAIL" in str(k)]
              print()
              print("=== DEPLOYMENT BLOCKED — DbIntegrityHealthIndicator returned DOWN ===")
              for k in fail_keys:
                  print(f"  {k}: {details[k]}")
              sys.exit(1)

          # Verify canonical counts
          failures = []
          checks = {
              'published_total':              (320, "Expected 320 PUBLISHED exams"),
              'year_3':                       (80,  "Expected 80 Year 3 exams"),
              'year_5':                       (80,  "Expected 80 Year 5 exams"),
              'year_7':                       (80,  "Expected 80 Year 7 exams"),
              'year_9':                       (80,  "Expected 80 Year 9 exams"),
              'package_FREE':                 (20,  "Expected 20 FREE exams"),
              'package_ADVANCED':             (100, "Expected 100 ADVANCED exams"),
              'package_PREMIUM':              (200, "Expected 200 PREMIUM exams"),
              'year_domain_pairs_wrong_count':(0,   "All year/domain pairs must have exactly 16 exams"),
              'published_without_questions':  (0,   "Zero published exams with no questions"),
              'audio_response_spelling':      (0,   "Zero AUDIO_RESPONSE in Spelling domain"),
          }

          for key, (expected, msg) in checks.items():
              actual = details.get(key)
              if actual is None:
                  failures.append(f"MISSING metric '{key}'\n    Expected: {expected}\n    Actual:   (not in response)\n    Check:    {msg}")
              elif int(actual) != expected:
                  failures.append(f"FAIL: {key}\n    Expected: {expected}\n    Actual:   {actual}\n    Check:    {msg}")
              else:
                  print(f"  PASS: {key} = {actual} ✓")

          if failures:
              print()
              print("=== DEPLOYMENT BLOCKED ===")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)

          print()
          print("=== ALL CANONICAL COUNTS VERIFIED ===")
          print("  PUBLISHED_EXAMS       = 320  ✓")
          print("  YEAR_3/5/7/9          = 80 each  ✓")
          print("  FREE/ADVANCED/PREMIUM = 20/100/200  ✓")
          print("  YEAR_DOMAIN_PAIRS     = 16 each  ✓")
          print("  EMPTY_PUBLISHED_EXAMS = 0  ✓")
          print("  AUDIO_RESPONSE_SPELL  = 0  ✓")
          print()
          print("DB_INTEGRITY_GATE = PASS")
          EOF

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [build-and-push, db-integrity-gate]
    if: needs.db-integrity-gate.result == 'success'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend to Vercel UAT
        run: |
          cd frontend
          UAT_API="${{ vars.UAT_API_URL }}"
          if [ -z "$UAT_API" ]; then UAT_API="https://naplanprep-backend-uat-uat.up.railway.app/v1"; fi
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL="$UAT_API" \
            --build-env VITE_STRIPE_KEY=${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --prod --yes
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-admin:
    name: Deploy Admin to Vercel
    runs-on: ubuntu-latest
    needs: [build-and-push, db-integrity-gate]
    if: needs.db-integrity-gate.result == 'success'

    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy admin to Vercel UAT
        run: |
          cd admin-panel
          UAT_API="${{ vars.UAT_API_URL }}"
          if [ -z "$UAT_API" ]; then UAT_API="https://naplanprep-backend-uat-uat.up.railway.app/v1"; fi
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL="$UAT_API" \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --prod --yes
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  smoke-test:
    name: Remote UAT Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-admin]
    if: ${{ vars.UAT_API_URL != '' }}

    steps:
      - name: Backend health (final confirmation)
        run: |
          API_BASE_URL="${{ vars.UAT_API_URL }}"
          ACTUATOR_BASE_URL="${{ vars.UAT_ACTUATOR_BASE_URL }}"
          if [ -z "$ACTUATOR_BASE_URL" ]; then
            ACTUATOR_BASE_URL="${API_BASE_URL%/v1}"
          fi
          HEALTH_URL="$ACTUATOR_BASE_URL/actuator/health"
          echo "Final health confirmation: $HEALTH_URL"
          curl -sf "$HEALTH_URL" | python3 -m json.tool

      - name: Plans API (public endpoint)
        run: |
          PLANS_URL="${{ vars.UAT_API_URL }}/subscriptions/plans"
          echo "Checking $PLANS_URL"
          RESPONSE=$(curl -sf "$PLANS_URL")
          echo "$RESPONSE" | python3 -m json.tool
          COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])))" 2>/dev/null || echo "0")
          echo "Plans returned: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: No subscription plans returned"
            exit 1
          fi
          echo "Plans API: PASS"

      - name: Register smoke test user and verify FREE catalog
        run: |
          BASE_URL="${{ vars.UAT_API_URL }}"
          TIMESTAMP=$(date +%s)
          EMAIL="smoke_${TIMESTAMP}@naplanprep-ci.test"
          PASSWORD="SmokeTest123!"

          # Register
          REG=$(curl -sf -X POST "$BASE_URL/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"firstName\":\"Smoke\",\"lastName\":\"Test\",\"role\":\"STUDENT\"}")
          echo "Register: $(echo $REG | python3 -c 'import sys,json; print(json.load(sys.stdin).get("message","?"))' 2>/dev/null)"

          # Login
          LOGIN=$(curl -sf -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then
            echo "FAIL: Could not obtain JWT token"
            echo "$LOGIN"
            exit 1
          fi
          echo "Login: PASS — JWT obtained"

          # Get catalog (FREE user sees only 20 AVAILABLE)
          CATALOG=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE_URL/exams?page=0&size=100")
          TOTAL=$(echo "$CATALOG" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('totalElements', d.get('data',{}).get('total', '?')))" 2>/dev/null || echo "?")
          AVAILABLE=$(echo "$CATALOG" | python3 -c "import sys,json; d=json.load(sys.stdin); items=d.get('data',{}).get('content',[]); print(len([x for x in items if x.get('status')=='AVAILABLE' or x.get('accessStatus')=='AVAILABLE']))" 2>/dev/null || echo "?")
          echo "Catalog total elements: $TOTAL"
          echo "AVAILABLE to FREE user: $AVAILABLE"
          echo "Remote FREE catalog check complete"

      - name: Start a spelling exam (SHORT_ANSWER verification)
        run: |
          BASE_URL="${{ vars.UAT_API_URL }}"
          TIMESTAMP=$(date +%s)
          EMAIL="spell_${TIMESTAMP}@naplanprep-ci.test"
          PASSWORD="SpellTest123!"

          curl -sf -X POST "$BASE_URL/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"firstName\":\"Spell\",\"lastName\":\"Test\",\"role\":\"STUDENT\"}" > /dev/null

          LOGIN=$(curl -sf -X POST "$BASE_URL/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('accessToken',''))" 2>/dev/null || echo "")

          # Get the FREE spelling exam ID (Year 3 Spelling Free)
          CATALOG=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE_URL/exams?page=0&size=100")
          SPELLING_EXAM=$(echo "$CATALOG" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          items=d.get('data',{}).get('content',d.get('data',[]))
          for x in items:
              title=x.get('title','')
              if 'Spelling' in title and 'Year 3' in title and 'Free' in title:
                  print(x.get('id',''))
                  break
          " 2>/dev/null || echo "")

          if [ -z "$SPELLING_EXAM" ]; then
            echo "Could not find Year 3 Spelling Free exam in catalog — skipping spelling session test"
            exit 0
          fi
          echo "Found Spelling exam: $SPELLING_EXAM"

          # Start session
          SESSION=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "$BASE_URL/exams/$SPELLING_EXAM/sessions" -d '{}')
          SESSION_ID=$(echo "$SESSION" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$SESSION_ID" ]; then
            echo "Could not start spelling session"
            echo "$SESSION"
            exit 1
          fi
          echo "Session started: $SESSION_ID"

          # Get questions — first question must be SHORT_ANSWER
          QUESTIONS=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE_URL/exams/sessions/$SESSION_ID/questions")
          FIRST_TYPE=$(echo "$QUESTIONS" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          qs=d.get('data',[])
          if qs: print(qs[0].get('questionType','?'))
          " 2>/dev/null || echo "?")
          echo "First question type: $FIRST_TYPE"
          if [ "$FIRST_TYPE" = "AUDIO_RESPONSE" ]; then
            echo "FAIL: AUDIO_RESPONSE still present in Spelling exam — V379 migration not applied"
            exit 1
          fi
          echo "Spelling SHORT_ANSWER check: PASS (type=$FIRST_TYPE)"

      - name: Summary
        run: |
          echo ""
          echo "=== REMOTE UAT SMOKE TEST SUMMARY ==="
          echo "  Backend health    : PASS"
          echo "  Plans API         : PASS"
          echo "  Auth flow         : PASS"
          echo "  DB integrity gate : PASS (validated in previous job)"
          echo "  Spelling type     : PASS (SHORT_ANSWER, no AUDIO_RESPONSE)"
          echo ""
          echo "REMOTE_UAT_READY = YES (pending full manual UAT sign-off)"
