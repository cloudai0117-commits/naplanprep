name: Setup — Create Stripe Test Products & Update DB

on:
  workflow_dispatch:

jobs:
  create-stripe-products:
    name: Create Stripe Test Prices & Update Migration
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Stripe products and prices
        id: stripe
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          create_price() {
            local product_name="$1"
            local amount="$2"
            local interval="$3"
            local interval_count="${4:-1}"

            # Create product
            PRODUCT=$(curl -s -X POST https://api.stripe.com/v1/products \
              -u "$STRIPE_KEY:" \
              -d "name=$product_name" \
              -d "metadata[platform]=naplanprep")
            PRODUCT_ID=$(echo "$PRODUCT" | grep -o '"id": *"[^"]*"' | head -1 | sed 's/.*"\(prod_[^"]*\)".*/\1/')
            echo "Created product: $product_name ($PRODUCT_ID)"

            # Create price
            PRICE=$(curl -s -X POST https://api.stripe.com/v1/prices \
              -u "$STRIPE_KEY:" \
              -d "product=$PRODUCT_ID" \
              -d "unit_amount=$amount" \
              -d "currency=aud" \
              -d "recurring[interval]=$interval" \
              -d "recurring[interval_count]=$interval_count" \
              -d "metadata[plan]=${product_name,,}" \
              -d "metadata[platform]=naplanprep")
            PRICE_ID=$(echo "$PRICE" | grep -o '"id": *"[^"]*"' | head -1 | sed 's/.*"\(price_[^"]*\)".*/\1/')
            echo "Created price: $PRICE_ID"
            echo "$PRICE_ID"
          }

          echo "=== Creating Stripe Test Products ==="

          STD_MONTHLY=$(create_price "NAPLANPrep Standard Monthly" 1499 month | tail -1)
          echo "Standard Monthly: $STD_MONTHLY"

          STD_ANNUAL=$(create_price "NAPLANPrep Standard Annual" 12900 year | tail -1)
          echo "Standard Annual: $STD_ANNUAL"

          PREM_MONTHLY=$(create_price "NAPLANPrep Premium Monthly" 2499 month | tail -1)
          echo "Premium Monthly: $PREM_MONTHLY"

          PREM_ANNUAL=$(create_price "NAPLANPrep Premium Annual" 21900 year | tail -1)
          echo "Premium Annual: $PREM_ANNUAL"

          echo "std_monthly=$STD_MONTHLY" >> $GITHUB_OUTPUT
          echo "std_annual=$STD_ANNUAL" >> $GITHUB_OUTPUT
          echo "prem_monthly=$PREM_MONTHLY" >> $GITHUB_OUTPUT
          echo "prem_annual=$PREM_ANNUAL" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Summary ==="
          echo "Standard Monthly: $STD_MONTHLY"
          echo "Standard Annual:  $STD_ANNUAL"
          echo "Premium Monthly:  $PREM_MONTHLY"
          echo "Premium Annual:   $PREM_ANNUAL"

      - name: Create migration with real Stripe price IDs
        run: |
          cat > backend/src/main/resources/db/migration/V25__configure_stripe_prices.sql << 'SQLEOF'
          -- Configure real Stripe test price IDs for payment checkout
          UPDATE plans SET
            stripe_monthly_price_id = '${{ steps.stripe.outputs.std_monthly }}',
            stripe_annual_price_id  = '${{ steps.stripe.outputs.std_annual }}'
          WHERE slug = 'standard';

          UPDATE plans SET
            stripe_monthly_price_id = '${{ steps.stripe.outputs.prem_monthly }}',
            stripe_annual_price_id  = '${{ steps.stripe.outputs.prem_annual }}'
          WHERE slug = 'premium';
          SQLEOF

          echo "Created migration V25__configure_stripe_prices.sql"
          cat backend/src/main/resources/db/migration/V25__configure_stripe_prices.sql

      - name: Commit and push migration
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backend/src/main/resources/db/migration/V25__configure_stripe_prices.sql
          git commit -m "feat(stripe): configure real Stripe test price IDs via V25 migration

          Auto-generated by setup-stripe workflow.
          Standard Monthly: ${{ steps.stripe.outputs.std_monthly }}
          Standard Annual:  ${{ steps.stripe.outputs.std_annual }}
          Premium Monthly:  ${{ steps.stripe.outputs.prem_monthly }}
          Premium Annual:   ${{ steps.stripe.outputs.prem_annual }}"
          git push origin develop

      - name: Show result summary
        run: |
          echo "## Stripe Configuration Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Plan | Interval | Price ID |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Standard | Monthly | ${{ steps.stripe.outputs.std_monthly }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Standard | Annual | ${{ steps.stripe.outputs.std_annual }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Premium | Monthly | ${{ steps.stripe.outputs.prem_monthly }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Premium | Annual | ${{ steps.stripe.outputs.prem_annual }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "V25 migration committed to develop. Deploy UAT will apply it on next push." >> $GITHUB_STEP_SUMMARY
