name: Railway Quick Fix — Force UAT Profile

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  RAILWAY_API: https://backboard.railway.app/graphql/v2
  RAILWAY_PROJECT_ID: fc40e9ef-0983-4774-b3ec-7ec138bb370a
  RAILWAY_ENV_ID: 588e636a-0be4-4fee-8a7e-02ce26f5ec6f
  RAILWAY_BACKEND_SERVICE_ID: 58b84f41-861e-41e1-9440-e73d5a54e18b
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/naplanprep-backend

jobs:
  fix-railway:
    name: Fix Railway — Set UAT profile and redeploy existing image
    runs-on: ubuntu-latest

    steps:
      - name: Set required Railway env vars
        run: |
          upsert() {
            curl -sf -X POST "${{ env.RAILWAY_API }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -d "{\"query\":\"mutation{variableUpsert(input:{projectId:\\\"${{ env.RAILWAY_PROJECT_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",name:\\\"$1\\\",value:\\\"$2\\\"})}\"}" > /dev/null \
              && echo "Set $1"
          }
          upsert "SPRING_PROFILES_ACTIVE" "uat"
          upsert "STRIPE_SECRET_KEY"       "${{ secrets.STRIPE_TEST_SECRET_KEY }}"
          upsert "STRIPE_WEBHOOK_SECRET"   "${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}"
          upsert "STRIPE_PUBLISHABLE_KEY"  "${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}"

      - name: Update start command with all critical JVM properties
        run: |
          CMD="java -Dspring.profiles.active=uat -Dspring.flyway.validate-on-migrate=false -Dspring.flyway.out-of-order=true -Dspring.jpa.hibernate.ddl-auto=none -Dspring.data.redis.connect-timeout=3000 -jar /app/app.jar"
          curl -sf -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"mutation{serviceInstanceUpdate(serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",input:{source:{image:\\\"${{ env.BACKEND_IMAGE }}:uat-latest\\\"},startCommand:\\\"$CMD\\\"})}\"}" \
            && echo "Updated start command: $CMD"

      - name: Trigger Railway redeployment
        run: |
          curl -sf -X POST "${{ env.RAILWAY_API }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -d "{\"query\":\"mutation{environmentTriggersDeploy(input:{projectId:\\\"${{ env.RAILWAY_PROJECT_ID }}\\\",environmentId:\\\"${{ env.RAILWAY_ENV_ID }}\\\",serviceId:\\\"${{ env.RAILWAY_BACKEND_SERVICE_ID }}\\\"})}\"}" \
            && echo "Triggered Railway redeployment"

      - name: Wait for backend to start (180s)
        run: sleep 180

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://naplanprep-backend-uat-uat.up.railway.app/actuator/health"; then
              echo "Backend is UP"
              exit 0
            fi
            echo "Attempt $i/10 — waiting 15s..."
            sleep 15
          done
          echo "Backend still not responding after retries"
          exit 1
