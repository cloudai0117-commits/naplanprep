name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to deploy (e.g. uat-abc1234). Leave blank to build from main.'
        required: false
        default: ''
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/naplanprep

jobs:
  validate:
    name: Validate Deployment Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "ERROR: You must type DEPLOY to confirm. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
          echo "Production deployment confirmed."

  build-and-push:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: resolve-tag
        run: |
          if [ -n "${{ github.event.inputs.image-tag }}" ]; then
            echo "tag=${{ github.event.inputs.image-tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=prod-$(echo $GITHUB_SHA | head -c 8)" >> $GITHUB_OUTPUT
          fi

      - name: Build & push backend (skip if reusing UAT image)
        if: github.event.inputs.image-tag == ''
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.resolve-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag UAT image as prod (if reusing)
        if: github.event.inputs.image-tag != ''
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.event.inputs.image-tag }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.event.inputs.image-tag }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.event.inputs.image-tag }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:prod-latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build & push frontend
        if: github.event.inputs.image-tag == ''
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PROD_API_URL }}
            VITE_STRIPE_KEY=${{ secrets.PROD_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.resolve-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:prod-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin panel
        if: github.event.inputs.image-tag == ''
        uses: docker/build-push-action@v5
        with:
          context: ./admin-panel
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PROD_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:${{ steps.resolve-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:prod-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/naplanprep-prod

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-backend:prod-latest
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:prod-latest
            docker pull ghcr.io/${{ env.IMAGE_PREFIX }}-admin:prod-latest

            # Zero-downtime rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --no-build

            # Health check loop
            echo "Waiting for backend health..."
            for i in $(seq 1 60); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Backend is UP"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "Health check timed out — rolling back"
                docker compose -f docker-compose.prod.yml rollback || true
                exit 1
              fi
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps

      - name: Production smoke tests
        run: |
          sleep 15
          # Health
          curl -f ${{ vars.PROD_API_URL }}/actuator/health || exit 1
          # Plans endpoint (no auth required)
          curl -f ${{ vars.PROD_API_URL }}/v1/subscriptions/plans || exit 1
          echo "Production smoke tests passed"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prod-${{ github.run_number }}-${{ github.sha }}
          name: "Production Deploy #${{ github.run_number }}"
          body: |
            ## Production Deployment

            - **Commit**: ${{ github.sha }}
            - **Image tag**: ${{ needs.build-and-push.outputs.image-tag }}
            - **Deployed by**: ${{ github.actor }}
            - **Timestamp**: ${{ github.event.head_commit.timestamp }}

            ### Deployed Services
            - Backend API
            - Student Frontend
            - Admin Panel
          draft: false
          prerelease: false

      - name: Notify on failure
        if: failure()
        run: |
          echo "PRODUCTION DEPLOYMENT FAILED for commit ${{ github.sha }}"
          echo "Manual rollback may be required on the production server."
          exit 1
