name: Deploy — Production

# Runs only after CI passes on main, OR via manual trigger (workflow_dispatch)
on:
  workflow_run:
    workflows: ["CI — Test & Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

jobs:
  guard:
    name: Guard — CI must have passed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Confirm manual deploy input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "ERROR: Type DEPLOY to confirm. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
          echo "Production deployment confirmed."

  deploy-backend-prod:
    name: Deploy Backend to Railway PROD
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway PROD
        run: |
          cd backend
          railway up --service naplanprep-backend-prod --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for Railway to be ready
        run: sleep 30

  deploy-frontend-prod:
    name: Deploy Frontend to Vercel PROD
    runs-on: ubuntu-latest
    needs: deploy-backend-prod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy frontend to Vercel PROD
        run: |
          cd frontend
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL=${{ secrets.PROD_API_URL }} \
            --build-env VITE_STRIPE_KEY=${{ secrets.STRIPE_LIVE_PUBLISHABLE_KEY }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-admin-prod:
    name: Deploy Admin to Vercel PROD
    runs-on: ubuntu-latest
    needs: deploy-backend-prod

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy admin to Vercel PROD
        run: |
          cd admin-panel
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --build-env VITE_API_URL=${{ secrets.PROD_API_URL }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  smoke-test-prod:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend-prod, deploy-admin-prod]

    steps:
      - name: Health and API checks
        run: |
          sleep 20
          curl -f ${{ secrets.PROD_API_URL }}/actuator/health || exit 1
          curl -f ${{ secrets.PROD_API_URL }}/subscriptions/plans || exit 1
          echo "Production smoke tests passed"

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-backend-prod, deploy-frontend-prod, deploy-admin-prod, smoke-test-prod]
    if: always()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            NAPLANPrep Production Deployment: ${{ job.status }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
